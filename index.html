}

@keyframes slideInTop { 0% { transform: translateY(var(--slideD)); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }

body.dark-mode .flashcard::-webkit-scrollbar-thumb:hover { background: #c99e64; }
.card-content { font-size: 1.2rem; line-height: 1.75; color: #1a1612; width: 100%; text-align: center; }
.flashcard.front-basic { display: flex; flex-direction: column; align-items: center; justify-content: center; }   /* basic card front: big, centered question */
.flashcard.front-basic #question-content { text-align: center; line-height: 1.25; }
.card-content.left-align { text-align: left; }
.dim-paren { opacity: 0.5; }
.answer-section .card-content { text-align: left; }

/* ── 7. IMAGE OCCLUSION ─────────────────────────────────── */
.io-card-image { position: relative; width: 100%; display: inline-block; }
.io-card-image img { max-width: 100%; height: auto; max-height: none; display: block; }
.io-overlay { position: absolute; inset: 0; pointer-events: none; }
.io-overlay svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
.answer-section { margin-top: 1.4rem; padding-top: 1.4rem; border-top: 1px solid #d4cec4; width: 100%; display: none; }

/* ── PROGRESS BAR + GRADE BALL BUTTONS ──────────────────── */
.progress-row { width: 100%; display: flex; align-items: center; gap: 12px; position: relative; margin-top: 30px; z-index: 2; }   /* as close to the card as possible without the bar overlapping the peeker bubble */
.progress-tube { flex: 1; height: 14px; background: #e9e5dd; border-radius: 999px; overflow: hidden; box-shadow: inset 0 1px 3px rgba(0,0,0,0.14); }
.progress-fill { height: 100%; width: 0%; background: #9ab8a1; border-radius: 999px; transition: width 0.4s ease; }
body.dark-mode .progress-fill { background: #6f8f77; }
body.dark-mode .progress-tube { background: #5a5148; }
.progress-tube.flash { overflow: visible; }
@keyframes fillGlow { 0%,100% { filter: brightness(1); box-shadow: none; } 45% { filter: brightness(1.9); box-shadow: 0 0 20px 6px rgba(110,200,150,0.95); } }
.progress-fill.flash { animation: fillGlow 1s ease; }
/* celebration: a full green progress bar breathing a soft glow */
.progress-row.celebrating .ball-btn { display: none; }
.progress-row.celebrating .progress-tube { overflow: visible; }
.progress-row.celebrating .progress-fill { width: 100% !important; background: #3a7a52; box-shadow: 0 0 12px 3px rgba(110,200,150,0.55); }   /* the JS visualizer pulses this glow with the music */
.ball-btn { width: 46px; height: 46px; flex-shrink: 0; border-radius: 50%; border: 1px solid #d4cec4; background: #fffef9; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,0.12); display: flex; align-items: center; justify-content: center; padding: 0; touch-action: manipulation; transition: transform 0.1s ease, box-shadow 0.1s ease; }
.ball-btn:active { transform: scale(0.92); box-shadow: 0 2px 6px rgba(0,0,0,0.18); }
.ball-btn.grade-correct { background: #9ab8a1; border-color: #9ab8a1; color: #ffffff; --glow: #9ab8a1; }
body.dark-mode .ball-btn.grade-correct { background: #6f8f77; border-color: #6f8f77; --glow: #6f8f77; }
.ball-btn.grade-again { background: #f5ab97; border-color: #f5ab97; color: #ffffff; --glow: #f5ab97; }
body.dark-mode .ball-btn.grade-again { background: #e8a08b; border-color: #e8a08b; color: #ffffff; --glow: #e8a08b; }

/* ── 8. VASTAUS- & ARVIOINTIPAINIKKEET ──────────────────── */
.btn-row { display: flex; gap: 1rem; width: 100%; }
.show-btn { width: 100%; background: #56533c; color: #f5f0e8; border: none; border-radius: 8px; padding: 0.9rem; font-family: 'Lora', serif; font-size: 1rem; cursor: pointer; }
.cloze-blank { display: inline-block; background: #e8e4db; border-radius: 4px; padding: 0 0.4em; color: transparent; min-width: 3em; }
.cloze-answer, .cloze-answer-line { background: none; color: inherit; font-weight: inherit; }
.grade-btn { flex: 1; border: none; border-radius: 8px; padding: 1rem; font-family: 'JetBrains Mono', monospace; font-size: 0.88rem; font-weight: 500; cursor: pointer; color: white; }
.btn-wrong { background: #c0392b; }
.btn-right { background: #498d65; }

/* ── 9. TUMMATILA ────────────────────────────────────────── */
body.dark-mode { background: #2b211b; color: #eadfce; }
body.dark-mode .flashcard,
body.dark-mode #card-comment,
body.dark-mode .group-card,
body.dark-mode .add-group-btn,
body.dark-mode .comment-box,
body.dark-mode .comment-display,
body.dark-mode .comment-item,
body.dark-mode .brand-front,
body.dark-mode .brand-back,
body.dark-mode #back-btn-fixed,
body.dark-mode .video-overlay { background: #3a312b; color: #eadfce; border-color: #6d5f52; }
body.dark-mode .comment-box::before { color: #9a8878; }
body.dark-mode .card-content,
body.dark-mode .comment-item,
body.dark-mode .comment-display { color: #eadfce; }
body.dark-mode .back-btn, body.dark-mode .remaining, body.dark-mode .deck-name, body.dark-mode .comment-status { color: #cbbda8; border-color: #6d5f52; }
body.dark-mode .brand-back { color: #cbbda8; }
body.dark-mode .show-btn { background: #eadfce; color: #2b211b; }
body.dark-mode .answer-section { border-top-color: #6d5f52; }
body.dark-mode .cloze-blank { background: #5a5148; }
body.dark-mode .cloze-answer, body.dark-mode .cloze-answer-line { background: none; color: inherit; }
body.dark-mode .video-overlay { background: #3a312b !important; }
body.dark-mode .video-cover { background: #3a312b !important; border-color: #6d5f52 !important; }
body.dark-mode .video-cover > span { color: #eadfce !important; }
body.dark-mode #back-btn-fixed { background: #3a312b !important; color: #eadfce !important; border-color: #6d5f52 !important; }
body.dark-mode #gear-btn-wrap > button { background: #3a312b !important; border-color: #6d5f52 !important; }
body.dark-mode #presence-list span { background: #3a312b !important; border-color: #6d5f52 !important; color: #eadfce !important; }
body.dark-mode .kuvaaja-btn { color: #eadfce !important; border-color: #6d5f52 !important; }
body.dark-mode .kuvaaja-cancel { border-color: #c0392b !important; color: #c0392b !important; }
body.dark-mode #loading { color: #eadfce; }
body.dark-mode .deck-header-name { color: #eadfce; }
body.dark-mode .deck-header-code  { color: #cbbda8; }

/* ── DARK MODE: new top-bar buttons ─────────────────────── */
body.dark-mode #darkmode-btn { background: #3a312b !important; border-color: #6d5f52 !important; }
body.dark-mode #deploy-timestamp-pill { background: #3a312b; color: #eadfce; border-color: #6d5f52; }
body.dark-mode #exit-devmode-btn { background: #3a312b !important; border-color: #6d5f52 !important; }

/* ── 10. KOMMENTTILAATIKKO ───────────────────────────────── */
.comment-area { display: flex; flex-direction: column; gap: 8px; margin-top: 2.2rem; align-items: center; }   /* centered boxes */
.comment-box { position: relative; width: 100%; max-height: 64px; border: 1px solid #d4cec4; border-radius: 16px; background: #fffef9; box-shadow: 0 3px 12px rgba(0,0,0,0.12); overflow: hidden; cursor: pointer; transition: max-height 0.4s ease; }
body:not(.is-mobile) .comment-box { width: 50%; }   /* half size on desktop */
.comment-box::before { content: "💬  Kommentoi tätä korttia"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 0 1rem; color: #56533c; font-family: 'Lora', serif; font-size: 0.92rem; line-height: 1.25; text-align: center; transition: opacity 0.2s ease; pointer-events: none; }
.comment-box.open { max-height: 600px; overflow: visible; cursor: default; padding-bottom: 52px; }
.comment-box.open::before { opacity: 0; pointer-events: none; }
.comment-submit-btn { display: none; position: absolute; bottom: 12px; right: 12px; width: 36px; height: 36px; background: #498d65; border: none; border-radius: 50%; color: white; font-size: 1.1rem; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
.comment-box.open .comment-submit-btn { display: flex; align-items: center; justify-content: center; }
.comment-box.open .comment-img-btn { display: flex; align-items: center; justify-content: center; }
.comment-display { background: #fffef9; border: 1px solid #d4cec4; border-radius: 12px; padding: 0.8rem 1rem; font-family: 'Lora', serif; font-size: 0.88rem; line-height: 1.5; color: #56533c; box-shadow: 0 2px 8px rgba(0,0,0,0.07); display: none; white-space: pre-wrap; }
.comment-feed { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; align-items: center; }   /* centered comment boxes */
.comment-item { background: #fffef9; border: 1px solid #d4cec4; border-radius: 12px; padding: 0.7rem 1rem; font-family: 'Lora', serif; font-size: 0.82rem; line-height: 1.5; color: #56533c; box-shadow: 0 2px 6px rgba(0,0,0,0.06); width: max-content; max-width: 100%; text-align: left; }   /* as wide as the comment; text left */
.comment-item-time { font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; color: #a09080; margin-top: 4px; }
/* separate dev screen: online activity + every comment */
#dev-screen { display: none; width: 100%; }
.dev-screen-inner { width: 100%; max-width: 620px; margin: 0 auto; padding: 4.5rem 1rem 2rem; display: flex; flex-direction: column; gap: 0.6rem; }
.dev-back-btn { align-self: flex-start; background: none; border: 1px solid #d4cec4; border-radius: 999px; padding: 0.4rem 0.9rem; cursor: pointer; font-family: 'Lora', serif; color: #56533c; margin-bottom: 0.5rem; }
.dev-section-title { font-family: 'Lora', serif; font-weight: 700; font-size: 1.05rem; margin-top: 1rem; color: #56533c; }
body.dark-mode .dev-section-title, body.dark-mode .dev-back-btn { color: #eadfce; border-color: #6d5f52; }
/* dev-only: every comment, click to open its card */
#dev-comments-panel { width: min(92vw, 560px); margin: 0 auto; background: #fffef9; border: 1px solid #d4cec4; border-radius: 14px; padding: 0.8rem 1rem; box-shadow: 0 3px 12px rgba(0,0,0,0.1); }
body.dark-mode #dev-comments-panel { background: #2b211b; border-color: #6d5f52; }
.dev-comments-title { font-family: 'Lora', serif; font-weight: 700; font-size: 0.95rem; margin-bottom: 8px; color: #56533c; }
body.dark-mode .dev-comments-title { color: #eadfce; }
.dev-comment-row { display: flex; gap: 8px; align-items: baseline; padding: 0.45rem 0.3rem; border-top: 1px solid #ece7dd; cursor: pointer; }
.dev-comment-row:hover { background: #f5f1e8; border-radius: 8px; }
body.dark-mode .dev-comment-row { border-top-color: #4a4038; }
body.dark-mode .dev-comment-row:hover { background: #362c25; }
.dev-comment-deck { font-family: 'JetBrains Mono', monospace; font-size: 0.62rem; color: #a09080; flex-shrink: 0; max-width: 34%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dev-comment-snip { font-family: 'Lora', serif; font-size: 0.8rem; color: #56533c; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
body.dark-mode .dev-comment-snip { color: #eadfce; }
#card-comment { width: 100%; min-height: 360px; height: auto; opacity: 0; pointer-events: none; resize: none; overflow: hidden; border: none; outline: none; background: transparent; color: #1a1612; padding: 1.2rem; font-family: 'Lora', serif; font-size: 1rem; line-height: 1.5; transition: opacity 0.2s ease 0.15s; }
.comment-box.open #card-comment { opacity: 1; pointer-events: auto; }
.moodle-link { position: absolute; top: 12px; left: 12px; z-index: 3; width: 48px; height: 48px; }
.moodle-placeholder { width: 100%; height: 100%; object-fit: contain; border-radius: 8px; }

/* ── 11. SOLUKKO-LOGO ────────────────────────────────────── */
.site-brand { position: relative; width: min(202px, 45vw); aspect-ratio: 1 / 1; z-index: 9999; margin: 0 auto; }
.brand-inner { position: relative; width: 100%; height: 100%; }
.brand-inner.twitch { animation: logoTwitch 0.45s ease; }
.home-bubble { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); margin-bottom: 18px; width: max-content; max-width: 280px; background: #fffef9; color: #56533c; border: 2px solid #d4cec4; border-radius: 22px; padding: 0.8rem 1.1rem; box-shadow: 0 6px 20px rgba(0,0,0,0.16); font-family: 'Lora', serif; font-size: 0.9rem; line-height: 1.4; text-align: center; z-index: 10000; opacity: 0; pointer-events: none; transition: opacity 0.25s ease; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 0.5rem; }
.site-brand.home-bubble-open .home-bubble.active { opacity: 1; pointer-events: auto; }
.home-bubble::after { content: ""; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); width: 0; height: 0; border: 12px solid transparent; border-top-color: #fffef9; margin-top: -2px; }
body.dark-mode .home-bubble { background: #3a312b; color: #eadfce; border-color: #6d5f52; }
body.dark-mode .home-bubble::after { border-top-color: #3a312b; }
.user-word { font-weight: 700; overflow-wrap: anywhere; }   /* the nickname flows inline in the sentence, just bold */
#peek-logo { position: fixed; left: 0; width: 150px; height: 150px; transform: translateX(-100%); transition: transform 0.7s cubic-bezier(0.34, 1.4, 0.64, 1); z-index: 40; cursor: pointer; }
#peek-logo .brand-logo-img { width: 100%; height: 100%; }
#peek-logo[data-side="left"]  { left: 0; right: auto; transform: translateX(-100%); }
#peek-logo[data-side="left"].peek-show  { transform: translateX(-22%); }
#peek-logo[data-side="right"] { right: 0; left: auto; transform: translateX(100%); }
#peek-logo[data-side="right"].peek-show { transform: translateX(22%); }
body.is-mobile #peek-logo { width: 75px; height: 75px; }   /* half size on mobile so it never reaches the courses */
.peek-inner { width: 100%; height: 100%; position: relative; transition: transform 0.7s cubic-bezier(0.34, 1.4, 0.64, 1); }
#peek-logo[data-side="left"].peek-show  .peek-inner { transform: rotate(8deg); }
#peek-logo[data-side="right"].peek-show .peek-inner { transform: rotate(-8deg); }
.peek-bubble { position: absolute; top: 50%; transform: translateY(-50%); width: max-content; max-width: 230px; background: #fffef9; color: #56533c; border: 2px solid #d4cec4; border-radius: 22px; padding: 0.7rem 1rem; box-shadow: 0 6px 20px rgba(0,0,0,0.16); font-family: 'Lora', serif; font-size: 0.82rem; line-height: 1.35; display: none; align-items: center; gap: 0.5rem; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; }
.peek-bubble.active { display: flex; }
#peek-logo.bubble-open .peek-bubble.active { opacity: 1; pointer-events: auto; }
#peek-logo[data-side="left"]  .peek-bubble { left: 100%; margin-left: 14px; }
#peek-logo[data-side="right"] .peek-bubble { right: 100%; margin-right: 14px; }
.peek-bubble::before { content: ""; position: absolute; top: 0; bottom: 0; width: 22px; }   /* hover bridge over the gap */
#peek-logo[data-side="left"]  .peek-bubble::before { right: 100%; }
#peek-logo[data-side="right"] .peek-bubble::before { left: 100%; }
.peek-bubble::after { content: ""; position: absolute; top: 50%; transform: translateY(-50%); width: 0; height: 0; border: 11px solid transparent; }   /* speech-bubble tail */
#peek-logo[data-side="left"]  .peek-bubble::after { right: 100%; border-right-color: #fffef9; margin-right: -3px; }
#peek-logo[data-side="right"] .peek-bubble::after { left: 100%; border-left-color: #fffef9; margin-left: -3px; }
body.dark-mode .peek-bubble { background: #3a312b; color: #eadfce; border-color: #6d5f52; }
body.dark-mode #peek-logo[data-side="left"]  .peek-bubble::after { border-right-color: #3a312b; }
body.dark-mode #peek-logo[data-side="right"] .peek-bubble::after { border-left-color: #3a312b; }
/* mobile homepage: no animation at all — Mona and the decks appear/react without sliding, shaking or transitions */
body.is-mobile:not(.reviewing) #peek-logo,
body.is-mobile:not(.reviewing) #peek-logo *,
body.is-mobile:not(.reviewing) #deck-list .deck-btn,
body.is-mobile:not(.reviewing) #deck-list .deck-btn * { transition: none !important; animation: none !important; }
.peek-act-btn { width: 34px; height: 34px; border-radius: 50%; border: 1px solid #d4cec4; background: #fffef9; cursor: pointer; font-size: 1rem; line-height: 1; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
body.dark-mode .peek-act-btn { background: #2b211b; border-color: #6d5f52; }
.peek-act-btn.active { background: #2f80c4; border-color: #2f80c4; }
.brand-logo-img { width: 100%; height: 100%; object-fit: contain; display: block; -webkit-user-drag: none; user-select: none; }
.logo-eye { position: absolute; width: 18.5%; aspect-ratio: 1 / 1; transform: translate(-50%, -50%); display: flex; align-items: center; justify-content: center; }
.logo-pupil { width: 64%; height: 64%; border-radius: 50%; background: #141414; transition: transform 0.08s linear; }
.logo-eye.le { left: 29%; top: 45.5%; }
.logo-eye.re { left: 72.5%; top: 43.5%; }
.site-brand { cursor: pointer; }
.eyes-closed .logo-eye { display: none; }
.site-brand.twitch { animation: logoTwitch 0.45s ease; }
.peek-logo-shake { animation: logoTwitch 0.45s ease; }
@keyframes logoTwitch {
  0%,100% { transform: translate(0,0) rotate(0); }
  15% { transform: translate(-5px,3px) rotate(-4deg); }
  30% { transform: translate(5px,-3px) rotate(4deg); }
  45% { transform: translate(-4px,2px) rotate(-3deg); }
  60% { transform: translate(4px,-2px) rotate(3deg); }
  80% { transform: translate(-2px,1px) rotate(-1deg); }
}
.site-brand-inner { position: relative; width: 100%; height: 100%; will-change: transform; transform-style: preserve-3d; transition: transform 0.55s ease; }
.site-brand.flipped .site-brand-inner { transform: rotateY(180deg); }
.brand-front, .brand-back { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border: 1px solid #d4cec4; border-radius: 16px; background: #fffef9; box-shadow: 0 4px 18px rgba(0,0,0,0.12); }
.brand-front { display: flex; align-items: center; justify-content: center; gap: 12px; }
.brand-back { transform: rotateY(180deg); padding: 1.5rem; color: #56533c; font-family: 'Lora', serif; font-size: 1rem; line-height: 1.45; text-align: left; overflow: hidden; }
.site-brand img { width: 100%; height: 100%; object-fit: contain; }
.brand-front span { font-family: "EB Garamond", Garamond, serif; font-size: min(5rem, 15vw); font-weight: 600; color: #56533c; letter-spacing: -0.03em; }
body.dark-mode .brand-front span { color: #fff2cb; }
body.dark-mode .brand-back > div, body.dark-mode .brand-back > div > * { color: #eadfce !important; }
.site-brand img.logo-clicked { animation: logoClickPop 0.34s ease; }
@keyframes logoClickPop { 0%{transform:scale(1) rotate(0deg)} 35%{transform:scale(0.94) rotate(-2deg)} 70%{transform:scale(1.05) rotate(1deg)} 100%{transform:scale(1) rotate(0deg)} }
.site-brand img { transition: filter 0.4s ease; will-change: filter; }
.subdeck-video-link { display: block; text-decoration: none; }
.subdeck-video-link:hover { text-decoration: underline; }
.group-tools { display: none !important; }
.group-scoreboard { display: none !important; }
.deck-header-name { font-family: 'Lora', serif; color: #1a1612; }
.deck-header-code  { font-family: 'JetBrains Mono', monospace; color: #6b6055; }

/* ── 12. OVERVIEW GRID ───────────────────────────────────── */
#card-overview-grid { width: 100%; display: flex; flex-direction: column; gap: 2.5rem; margin-top: 12rem; }
.overview-section { width: 100%; }
.grid-shuffle-btn { position: absolute; right: 0; bottom: 0.7rem; width: 36px; height: 36px; border-radius: 50%; border: 1px solid #d4cec4; background: #fffef9; cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,0.08); padding: 0; transition: transform 0.1s ease; }
.grid-shuffle-btn:active { transform: scale(0.9); }
body.dark-mode .grid-shuffle-btn { background: #3a312b; border-color: #6d5f52; }
.overview-card { will-change: transform; }
.overview-section-title { font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; color: #6b6055; margin-bottom: 0.45rem; padding-bottom: 0.25rem; border-bottom: 1px solid #d4cec4; }
.overview-section-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; }
body.dark-mode .overview-section-title { color: #cbbda8; border-bottom-color: #6d5f52; }

/* Overview card — position:relative needed for star badge */
.overview-card { background: #fffef9; border: 1px solid #d4cec4; border-radius: 10px; padding: 0.9rem; aspect-ratio: 1 / 1.5; height: auto; font-size: 0.68rem; line-height: 1.25; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; text-overflow: ellipsis; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.06); word-break: break-word; position: relative; }   /* vertical on all devices */

/* ── STAR BADGE inside overview cards ─────────────────────  */
.overview-card-stars {
  position: absolute;
  bottom: 4px;
  right: 5px;
  font-size: 0.48rem;
  color: #6b4423;
  line-height: 1;
  letter-spacing: -0.04em;
  pointer-events: none;
  display: block;
}
body.dark-mode .overview-card-stars { color: #eadfce; }

.subdeck-video-embed { width: 100%; aspect-ratio: 16/9; border-radius: 10px; overflow: hidden; margin: 0.5rem 0; background: #000; }
.subdeck-video-embed iframe { width: 100%; height: 100%; border: none; }
.overview-card.active  { border: 2px solid #498d65; }
.overview-card.known   { background: #ebf1ed; border-color: #9ab8a1; }
.overview-card.unknown { background: #fce4d0; border-color: #ef9a5f; }   /* "En tiedä" cards painted orange */
body.dark-mode .overview-card { background: #3a312b; color: #eadfce; border-color: #6d5f52; }
body.dark-mode .overview-card.known   { background: #303d35; border-color: #6f8f77; }
body.dark-mode .overview-card.unknown { background: #3f3022; border-color: #b87a45; }

  {name:'A',score:0},{name:'B',score:0},{name:'C',score:0}
]));

// ════════════════════════════════════════════════════════════
// ② KÄYTTÄJÄN IDENTITEETTI
// ════════════════════════════════════════════════════════════
function getUserId(){
  let uid = localStorage.getItem('solukko-uid');
  if(!uid){ uid = Math.random().toString(36).slice(2)+Date.now().toString(36); localStorage.setItem('solukko-uid',uid); }
  return uid;
}


// ════════════════════════════════════════════════════════════
// ③ TUMMATILA & KEHITTÄJÄTILA
// ════════════════════════════════════════════════════════════

function applyDarkMode(){
  document.body.classList.toggle('dark-mode', darkMode);
  const t=document.getElementById('dark-toggle-input2'); if(t) t.checked=darkMode;
  const icon=document.getElementById('darkmode-icon');
  if(icon) icon.textContent = darkMode ? '🌙' : '☀️';
  document.querySelectorAll('.peek-dark-btn').forEach(b=>b.textContent = darkMode ? '☀️' : '🌙');
}

function toggleDarkModeFromSwitch(){
  darkMode = !darkMode;
  localStorage.setItem('anki-dark-mode', JSON.stringify(darkMode));
  applyDarkMode();
}

function applyDevMode(){
  const t=document.getElementById('dev-toggle-input2'); if(t) t.checked=devMode;
  const dp=document.getElementById('deploy-timestamp-pill');
  if(dp) dp.style.display = devMode ? 'flex' : 'none';
  const xb=document.getElementById('exit-devmode-btn');
  if(xb) xb.style.display = devMode ? 'flex' : 'none';
  if(typeof renderPresenceList==='function') renderPresenceList(_lastPresenceUsers||[]);   // refresh the dev presence list

function initDarkmodeBtn(){
  const btn    = document.getElementById('darkmode-btn');
  const circle = document.getElementById('darkmode-ring-circle');
  if(!btn) return;

  const CIRCUMFERENCE = 144.51;
  let pressTimer    = null;
  let ringTimer     = null;
  let longFired     = false;
  let ringRaf       = null;

  function resetRing(){
    cancelAnimationFrame(ringRaf); ringRaf = null;
    clearTimeout(ringTimer); ringTimer = null;
    if(circle){
      circle.style.transition    = 'none';
      circle.style.opacity       = '0';
      circle.style.strokeDashoffset = String(CIRCUMFERENCE);
    }
  }

  function startRingAnimation(){
    if(!circle) return;
    circle.style.opacity          = '1';
    circle.style.transition       = 'stroke-dashoffset 2s linear';
    circle.style.strokeDashoffset = '0';
  }

  function startPress(){
    longFired = false;
    btn.classList.add('pressing');
    resetRing();
    ringTimer = setTimeout(startRingAnimation, 3000);
    pressTimer = setTimeout(()=>{
      longFired = true;
      btn.classList.remove('pressing');
      resetRing();
      promptDevMode();
    }, 5000);
  }

  function cancelPress(wasTap){
    clearTimeout(pressTimer); pressTimer = null;
    clearTimeout(ringTimer);  ringTimer  = null;
    resetRing();
    btn.classList.remove('pressing');
    if(wasTap && !longFired) toggleDarkModeFromSwitch();
  }

  btn.addEventListener('pointerdown',  e => { e.preventDefault(); startPress(); });
  btn.addEventListener('pointerup',    () => cancelPress(true));
  btn.addEventListener('pointerleave', () => cancelPress(false));
  btn.addEventListener('pointercancel',() => cancelPress(false));
  btn.addEventListener('click', e => e.stopPropagation());
}

function promptDevMode(){
  const pw = prompt('Anna kehittäjätilan salasana:');
  if(!pw) return;
  crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw))
    .then(buf=>{
      const hash = Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
      if(hash === '5d4da5b963892e66c2e856c5ea7df4dc76183d999d4ec8ded89b9f7e50635335'){
        devMode = !devMode;
        localStorage.setItem('anki-dev-mode', JSON.stringify(devMode));
        if(devMode){
          db.collection('gamestate').doc('devOwner').set({
            userId: getUserId(),
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
          }).catch(()=>{});
          db.collection('gamestate').doc('current').set({
            active: true,
            cardId: currentCard ? String(currentCard.cardId||currentCard.noteId||'') : null,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
          }).catch(()=>{});
        } else {
          db.collection('gamestate').doc('devOwner').delete().catch(()=>{});
          endGameSession();
        }
        applyDevMode();
        if(currentCard) loadFirestoreComments();
        listenToPresence();
      } else {
        alert('Väärä salasana.');
      }
    });
}

let audioCtx=null;

function playCashSound(){
  if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  const now=audioCtx.currentTime;
  [880,1175,1568].forEach((freq,i)=>{
    const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
    osc.type='triangle'; osc.frequency.value=freq;
    gain.gain.setValueAtTime(0,now+i*.06); gain.gain.linearRampToValueAtTime(.18,now+i*.06+.01); gain.gain.exponentialRampToValueAtTime(.001,now+i*.06+.12);
    osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now+i*.06); osc.stop(now+i*.06+.13);
  });
}

function playLogoClickSound(){
  if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();

  const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
  osc.type='sine'; osc.frequency.setValueAtTime(420,now); osc.frequency.exponentialRampToValueAtTime(760,now+.08);
  gain.gain.setValueAtTime(.001,now); gain.gain.linearRampToValueAtTime(.18,now+.015); gain.gain.exponentialRampToValueAtTime(.001,now+.16);
  osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now+.17);
}

// Decode the sound clips up front so a random one fires with zero delay on click
const _soundFiles=['frog1.mp3','frog2.mp3','frog3.mp3','frog4.mp3'];
const _soundBufs=[]; let _audioCtx=null;
const _soundEls=_soundFiles.map(f=>{ const a=new Audio(f); a.preload='auto'; a.volume=0.125; a.setAttribute('playsinline',''); return a; });
function _decodeFrogs(){   // decode the clips into buffers for zero-delay playback (needs a context)
  if(!_audioCtx) return;
  _soundFiles.forEach((f,i)=>{ if(_soundBufs[i]) return; fetch(f).then(r=>r.arrayBuffer()).then(b=>_audioCtx.decodeAudioData(b)).then(buf=>{ _soundBufs[i]=buf; }).catch(()=>{}); });
}
// Warm up on the first user gesture. iOS only unlocks Web Audio when the context is created/resumed
// inside a gesture, so we create it here (not at load) and also unlock the HTMLAudio fallbacks.
let _audioWarmed=false;
function _warmAudio(){
  if(_audioWarmed) return; _audioWarmed=true;
  try{
    if(!_audioCtx) _audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(_audioCtx.state==='suspended') _audioCtx.resume();
    _decodeFrogs();
    const buf=_soundBufs.find(b=>b) || _audioCtx.createBuffer(1,1,22050);   // play a clip silently to prime the path
    const s=_audioCtx.createBufferSource(); s.buffer=buf;
    const g=_audioCtx.createGain(); g.gain.value=0;
    s.connect(g); g.connect(_audioCtx.destination); s.start(0);
    _soundEls.forEach(a=>{ try{ a.muted=true; const p=a.play(); if(p&&p.then) p.then(()=>{ a.pause(); a.currentTime=0; a.muted=false; }).catch(()=>{ a.muted=false; }); }catch(e){} });   // silently unlock the HTMLAudio fallbacks for iOS
  }catch(e){}
}
['pointerdown','touchstart','keydown','click'].forEach(ev=>window.addEventListener(ev,_warmAudio,{capture:true,passive:true}));
function playScream(){
  if(!_audioCtx){ try{ _audioCtx=new (window.AudioContext||window.webkitAudioContext)(); _decodeFrogs(); }catch(e){} }
  const i=Math.floor(Math.random()*_soundFiles.length);   // random clip
  if(_soundBufs[i]&&_audioCtx){ try{ if(_audioCtx.state==='suspended') _audioCtx.resume(); const s=_audioCtx.createBufferSource(); s.buffer=_soundBufs[i]; const g=_audioCtx.createGain(); g.gain.value=0.125; s.connect(g); g.connect(_audioCtx.destination); s.start(0); return; }catch(e){} }
  try{ _soundEls[i].currentTime=0; _soundEls[i].muted=false; _soundEls[i].volume=0.125; _soundEls[i].play().catch(()=>{}); }catch(e){}
}
// Mona's hitbox is a circle the diameter of the PNG (the transparent corners aren't clickable)
function clickInCircle(ev, el){
  if(!ev || ev.clientX==null || !el) return true;
  const r=el.getBoundingClientRect(); const cx=r.left+r.width/2, cy=r.top+r.height/2, rad=el.offsetWidth/2;
  const dx=ev.clientX-cx, dy=ev.clientY-cy;
  return dx*dx + dy*dy <= rad*rad;
}

// Logo eyes follow the cursor — rAF-throttled with cached geometry so a mousemove
// never triggers a layout read (the old version did getBoundingClientRect + offsetParent
// on every eye on every mousemove = heavy layout thrashing).
(function initLogoEyes(){
  let px=0, py=0, ticking=false, cache=[], geomStale=true;
  function refresh(){   // expensive layout reads, done rarely (only when geometry may have changed)
    cache=[];
    document.querySelectorAll('.logo-eye').forEach(eye=>{
      if(eye.offsetParent===null) return;   // hidden
      const r=eye.getBoundingClientRect(); if(!r.width) return;
      cache.push({ pupil:eye.firstElementChild, cx:r.left+r.width/2, cy:r.top+r.height/2, max:r.width*0.18, fy:eye.closest('#card-peek')?-1:1 });
    });
    geomStale=false;
  }
  function apply(){   // hot path: no layout reads, just transform writes
    ticking=false;
    if(geomStale) refresh();
    for(const e of cache){ if(!e.pupil) continue; const ang=Math.atan2(py-e.cy, px-e.cx); e.pupil.style.transform='translate('+(Math.cos(ang)*e.max)+'px,'+(e.fy*Math.sin(ang)*e.max)+'px)'; }
  }
  function onMove(x,y){ px=x; py=y; if(!ticking){ ticking=true; requestAnimationFrame(apply); } }
  window.addEventListener('mousemove', e=>onMove(e.clientX,e.clientY), {passive:true});
  window.addEventListener('touchmove', e=>{ if(e.touches[0]) onMove(e.touches[0].clientX,e.touches[0].clientY); },{passive:true});
  const invalidate=()=>{ geomStale=true; };
  window.addEventListener('scroll', invalidate, {passive:true});
  window.addEventListener('resize', invalidate);
  setInterval(invalidate, 1000);   // re-read geometry ~1x/s to catch slow layout changes (peeker slide-in, Mona twitch)
})();

// ════════════════════════════════════════════════════════════
async function init(){
  show('loading');
  try {
    const SQL = await initSqlJs({ locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/${f}` });
    const res = await fetch('./' + APKG_FILE);
    if (!res.ok) throw new Error(APKG_FILE + ' not found (' + res.status + ')');
    const buf = await res.arrayBuffer();
    const zip = await JSZip.loadAsync(buf);

    const mediaFile = zip.file('media');
    if (mediaFile) {
      let mediaJson; try { mediaJson = await mediaFile.async('string'); } catch(e) {}
      if (mediaJson) {
        let mediaIndex = {}; try { mediaIndex = JSON.parse(mediaJson); } catch(e) {}
        await Promise.all(Object.entries(mediaIndex).map(async ([num, name]) => {
          const f = zip.file(num); if (!f) return;
          const b64  = await f.async('base64');
          const ext  = name.split('.').pop().toLowerCase();
          const mime = {png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',svg:'image/svg+xml',webp:'image/webp'}[ext] || 'application/octet-stream';
          mediaMap[name] = `data:${mime};base64,${b64}`;
        }));
      }
    }

    const dbFile = zip.file('collection.anki21') || zip.file('collection.anki2');
    if (!dbFile) throw new Error('Ei löydy collection.anki21 eikä collection.anki2 tiedostoa.');
    const dbBuf = await dbFile.async('arraybuffer');
    const db    = new SQL.Database(new Uint8Array(dbBuf));
    allCards = parseAnkiDB(db);
    allDeckNames = Object.values(JSON.parse(db.exec('SELECT decks FROM col')[0].values[0][0])).map(d => d.name).filter(Boolean);
    db.close();
    await loadDecks();
  } catch(e) {
    const d = document.getElementById('conn-error');
    d.style.display = 'block';
    d.innerHTML = '<strong>Virhe ladattaessa kortteja.</strong><br><br>' + e.message;
    hide('loading'); return;
  }
  hide('loading');
}

function parseAnkiDB(db) {
  const colRows = db.exec('SELECT decks, models FROM col');
  if (!colRows.length) return [];
  const decksData  = JSON.parse(colRows[0].values[0][0]);
  const modelsData = JSON.parse(colRows[0].values[0][1]);
  const deckMap = {};
  Object.values(decksData).forEach(d => { if (d.id != null && d.name) deckMap[String(d.id)] = d.name; });
  const modelFields = {}, modelNames = {};
  Object.entries(modelsData).forEach(([mid, m]) => { modelNames[mid]=m.name||''; modelFields[mid]=(m.flds||[]).map(f=>f.name); });
  const noteRows = db.exec('SELECT id, mid, flds, tags FROM notes');
  const notes = {};
  if (noteRows.length) {
    noteRows[0].values.forEach(([id, mid, flds, tags]) => {
      const vals=flds.split('\x1f'), fnames=modelFields[String(mid)]||[], fields={};
      vals.forEach((v,i)=>{ fields[fnames[i]||'field'+i]={value:v,order:i}; });
      notes[id]={ noteId:id, modelName:modelNames[String(mid)]||'', fields, tags:tags?tags.trim().split(/\s+/).filter(Boolean):[] };
    });
  }
  const cardRows = db.exec('SELECT id, nid, did, ord, due, type, queue FROM cards');
  const cards = [];
  if (cardRows.length) {
    cardRows[0].values.forEach(([cardId,noteId,did,ord,due,type,queue]) => {
      const note=notes[noteId]; if(!note) return;
      const deckName=deckMap[String(did)]||String(did);
      const fnames=Object.keys(note.fields);
      const frontF=fnames.find(f=>['front','question','text','content'].includes(f.toLowerCase()))||fnames[0]||'';
      const backF=fnames.find(f=>['back','answer','extra'].includes(f.toLowerCase()))||fnames[1]||'';
      cards.push({ cardId, noteId, deckName, modelName:note.modelName, fields:note.fields, tags:note.tags, question:note.fields[frontF]?.value||'', answer:note.fields[backF]?.value||'', due, type, queue, ord });
    });
  }
  return cards;
}

// ⑨ PAKKOJEN LATAAMINEN
// ════════════════════════════════════════════════════════════
// A "course" is a reviewable deck. Two layouts are supported:
//   • hierarchy (new): SOLUKKO::"N. LUKUVUOSI"::"N.M SYKSY|KEVÄT"::Course[::lecture…] — year/sem from the path
//   • flat (old):      SOLUKKO::Course[::lecture…] — year/sem from a (1S)/(2K) token in the name
// Returns a Map: coursePath -> { year, semester(S/K), name }.
function collectCourses(){
  const paths=new Set();
  (typeof allDeckNames!=='undefined'?allDeckNames:[]).forEach(d=>{ if(d&&d.startsWith('SOLUKKO')) paths.add(d); });
  (allCards||[]).forEach(c=>{ const d=c.deckName||''; if(d.startsWith('SOLUKKO')) paths.add(d); });
  const courses=new Map();
  paths.forEach(d=>{
    if(!d.startsWith('SOLUKKO::')) return;
    const segs=d.slice('SOLUKKO::'.length).split('::');
    if(/LUKUVUOSI/i.test(segs[0])){                         // hierarchy: year :: semester :: course :: …
      if(segs.length<3) return;                             // year or semester node — not a course
      const path='SOLUKKO::'+segs.slice(0,3).join('::');
      if(!courses.has(path)) courses.set(path,{ year:(segs[0].match(/(\d+)/)||[])[1]||'', semester:/SYKSY/i.test(segs[1])?'S':/KEV[ÄA]T/i.test(segs[1])?'K':'', name:segs[2] });
    } else {                                                // flat: course :: …
      const path='SOLUKKO::'+segs[0];
      if(!courses.has(path)){
        let year='',sem='';
        [...segs[0].matchAll(/\(([^)]*)\)/g)].forEach(m=>{ const mm=m[1].trim().match(/^(\d+)\s*([SKsk])$/); if(mm){ year=mm[1]; sem=mm[2].toUpperCase(); } });
        courses.set(path,{ year, semester:sem, name:segs[0] });
      }
    }
  });
  return courses;
}
// Map any card/deck path to its course path (the reviewable deck), for both layouts.
function coursePathOf(deckName){
  if(!deckName||!deckName.startsWith('SOLUKKO::')) return deckName;
  const segs=deckName.slice('SOLUKKO::'.length).split('::');
  if(/LUKUVUOSI/i.test(segs[0])) return 'SOLUKKO::'+segs.slice(0,3).join('::');   // hierarchy: year::sem::course
  return 'SOLUKKO::'+segs[0];                                                       // flat: course
}
async function loadDecks(){
  const courseMap=collectCourses();
  const names=[...courseMap.keys()];

  if(names.length === 0){
    const d = document.getElementById('conn-error'); d.style.display = 'block';

    return;
  }

  const list=document.getElementById('deck-list'); list.querySelectorAll('.deck-btn').forEach(b=>b.remove());
  await document.fonts.ready;
  const canvas=document.createElement('canvas'); const ctx2=canvas.getContext('2d'); ctx2.font='700 22px Lora, Georgia, serif';
  const decks=names.map(deck=>{
    const meta=courseMap.get(deck)||{};
    const name=meta.name||deck.replace('SOLUKKO::','');   // course name only (year/sem come from the path, not the name)
    // classify each parenthetical in the course name: link=(http…) code=(BKEM5024) video=(filename); ignore a stray (1S) token
    const parens=[...name.matchAll(/\(([^)]*)\)/g)].map(m=>m[1].trim());
    let courseCode='', videoName='';
    parens.forEach(p=>{
      if(/^https?:\/\//i.test(p)) return;                                            // moodle/peppi link
      if(/^\d+\s*[SKsk]$/.test(p)) return;                                            // stray (1S)/(2K) token — year/sem already known
      if(/^[A-Za-zÅÄÖåäö]{2,}\s?\d{2,}$/.test(p)){ if(!courseCode) courseCode=p; return; }        // course code
      if(/^[\w\s\-.åäöÅÄÖ]+$/.test(p)){ if(!videoName) videoName=p; return; }                       // filename-like (allow spaces + Finnish letters) -> video
    });
    const cleanName=name.replace(/\s*\([^)]*\)\s*/g,' ').replace(/\s+/g,' ').trim();   // strip every parenthetical
    const bgVideo = (videoName||cleanName) + '.mp4';            // named video if given, else fall back to the deck name
    const cardCount=(allCards||[]).filter(c=>c.deckName===deck || (c.deckName||'').startsWith(deck+'::')).length;
    const hasCards=cardCount>1;   // a lone card is just a placeholder -> keep the course dimmed & unclickable
    return {deck,cleanName,courseCode,bgVideo,year:meta.year||'',semester:meta.semester||'',hasCards};
  });
  let widestTitle=0; decks.forEach(d=>{ widestTitle=Math.max(widestTitle,ctx2.measureText(d.cleanName).width); });
  const finalCardWidth=Math.ceil(Math.min(448,Math.max(260,widestTitle+42)));
  document.documentElement.style.setProperty('--deck-card-width',finalCardWidth+'px');
  let _playingDeckVideo = null;
  const _htmlTextParser = new DOMParser();   // parse card HTML to text WITHOUT loading its <img>/gif resources

  decks.forEach(item=>{
    const btn=document.createElement('button'); btn.className='deck-btn'+(item.hasCards?'':' deck-empty');
    if(!item.hasCards){   // placeholder: static "under construction" image — no video/backsides (keeps the homepage light)
      btn.innerHTML=`<div class="pack-top"><img class="deck-construction" src="construction.png" alt=""><div class="deck-overlay"></div><div class="deck-label"><div class="deck-title">${item.cleanName}</div></div>${item.courseCode?`<div class="deck-code">${item.courseCode}</div>`:''}</div>`;
      item.btn=btn; return;
    }
    const _dc=(allCards||[]).filter(c=>c.deckName===item.deck || (c.deckName||'').startsWith(item.deck+'::'));   // real cards from this deck
    const _tops=_dc.map(c=>{ const _d=_htmlTextParser.parseFromString(extractBody(c.answer||'').body,'text/html'); return (_d.body.textContent||'').replace(/\{\{c\d+::(.*?)(?:::.*?)?\}\}/g,'$1').replace(/\s+/g,' ').trim(); }).filter(t=>t.length>0).sort((a,b)=>b.length-a.length).slice(0,4);   // the four longest backsides (text only, no image loads)
    const _bk=(cls,i)=>`<div class="pack-back ${cls}">${_tops[i]?`<div class="pack-back-content">${escCmt(_tops[i].slice(0,600))}</div>`:''}</div>`;
    btn.innerHTML=`${_bk('pack-back-4',3)}${_bk('pack-back-3',2)}${_bk('pack-back-2',1)}${_bk('pack-back-1',0)}<div class="pack-top"><video class="deck-video" muted playsinline preload="auto"><source src="${item.bgVideo}" type="video/mp4"><source src="video_immunologia.mp4" type="video/mp4"><source src="default.mp4" type="video/mp4"></video><div class="deck-overlay"></div><div class="deck-label"><div class="deck-title">${item.cleanName}</div></div><div class="deck-code">${item.courseCode}</div></div>`;
    if(!isMobile() && item.hasCards){
      btn.addEventListener('mouseenter',()=>{   // natural scattered flare, fresh each hover (each card drifts a random direction)
        btn.querySelectorAll('.pack-back').forEach((bk)=>{
          const ang=Math.random()*Math.PI*2, dist=7+Math.random()*10;
          const tx=(Math.cos(ang)*dist).toFixed(1), ty=(Math.sin(ang)*dist-2).toFixed(1), rot=((Math.random()*2-1)*16).toFixed(1);
          bk.style.transform='translate('+tx+'%,'+ty+'%) rotate('+rot+'deg)';
        });
      });
      btn.addEventListener('mouseleave',()=>{ btn.querySelectorAll('.pack-back').forEach(bk=>{ bk.style.transform=''; }); });
    }
    const video=btn.querySelector('.deck-video');

    function fitVideo(){
      const bw=btn.offsetWidth, bh=btn.offsetHeight;
      if(!bw||!bh||!video.videoWidth) return;
      const scale=bh/video.videoHeight;                  // match the deck height exactly
      const vw=video.videoWidth*scale, vh=bh;
      video.style.width=vw+'px'; video.style.height=vh+'px';
      video.style.left=((bw-vw)/2)+'px'; video.style.top='0px';   // centered horizontally, full deck height
      video.style.position='absolute';
    }
    function _stillTime(){ const d=video.duration||2; return Math.min(Math.max(0.8, d*0.25), d-0.05); }   // resting preview frame: ~25% in, past any black fade-in
    video.addEventListener('loadedmetadata', fitVideo, {once:true});
    video.addEventListener('loadeddata', ()=>{ fitVideo(); if(!isMobile()) video.currentTime=_stillTime(); },{once:true});

    let _rafId=null, _lastTs=null, _going=false;
    function _stopReverse(){ if(_rafId){ cancelAnimationFrame(_rafId); _rafId=null; } _lastTs=null; }
    function _reverseStep(ts){
      if(_lastTs===null) _lastTs=ts;
      const elapsed=(ts-_lastTs)/1000;
      if(elapsed<0.028){ _rafId=requestAnimationFrame(_reverseStep); return; }
      _lastTs=ts;
      const newTime=video.currentTime-elapsed;
      if(newTime<=0.02){ video.currentTime=0; _stopReverse(); if(_going) video.play().catch(()=>{}); }
      else { video.currentTime=Math.max(0,newTime); _rafId=requestAnimationFrame(_reverseStep); }
    }
    video.addEventListener('ended',()=>{ if(!_going) return; _stopReverse(); _lastTs=null; _rafId=requestAnimationFrame(_reverseStep); });
    function _start(){ _going=true; _stopReverse(); video.currentTime=0; video.play().catch(()=>{}); }
    function _stop(){ _going=false; _stopReverse(); video.pause(); video.currentTime=_stillTime(); }   // rest on the content frame, not the (maybe black) start

    if(!isMobile()){   // desktop: clickable courses ping-pong the video on hover; empty ones just rest on the still frame
      if(item.hasCards){ btn.addEventListener('mouseenter', _start); btn.addEventListener('mouseleave', _stop); }
    } else {   // mobile: no playback — freeze on the 15th frame as a still (looping video was eating the first scroll swipe)
      video.loop=false; video.muted=true; video.setAttribute('muted',''); video.setAttribute('playsinline','');
      let _frozen=false;
      const _freeze=()=>{ if(_frozen) return; _frozen=true; try{ video.pause(); video.currentTime=_stillTime(); }catch(e){} };   // after decoding, jump to the content frame (skips a black intro)
      if('requestVideoFrameCallback' in HTMLVideoElement.prototype){
        let _fc=0;
        const _tick=()=>{ if(_frozen) return; if(++_fc>=15){ _freeze(); return; } video.requestVideoFrameCallback(_tick); };   // stop on the 15th presented frame
        video.requestVideoFrameCallback(_tick);
      } else {
        const _onTU=()=>{ if(video.currentTime>=0.5){ video.removeEventListener('timeupdate',_onTU); _freeze(); } };   // fallback: ~15th frame at 30fps
        video.addEventListener('timeupdate',_onTU);
      }
      const p=video.play(); if(p&&p.catch) p.catch(()=>{});   // play muted just long enough to decode the still, then freeze (iOS won't decode frames otherwise)
    }
    if(item.hasCards) btn.onclick=()=>startDeck(item.deck);   // empty placeholders aren't clickable
    item.btn=btn;
    if(!isMobile()) video.addEventListener('loadeddata',()=>{ video.currentTime=_stillTime(); },{once:true});
  });
  buildDeckGrid(decks, list);
  updateSoluvisaCircle();
  hide('card-screen');

  const _p=new URLSearchParams(window.location.search);
  const _pc=_p.get('solukko-card'), _pa=_p.get('solukko-answer');
  if(_pc){
    const _tc=allCards.find(c=>String(c.cardId)===_pc);
    if(_tc){ const _topDeck=coursePathOf(_tc.deckName); if(names.includes(_topDeck)){ await startDeck(_topDeck); const _ci=reviewCards.findIndex(c=>String(c.cardId)===_pc); if(_ci>=0){ jumpToOverviewCard(_ci); if(_pa==='1') setTimeout(()=>showAnswer(),600); } return; } }
  }
  const savedDeck=sessionStorage.getItem('solukko-savedDeck'), savedIdx=parseInt(sessionStorage.getItem('solukko-savedCardIdx')||'0');
  if(savedDeck&&names.includes(savedDeck)){ await startDeck(savedDeck); if(savedIdx>0&&reviewCards[savedIdx]){ jumpToOverviewCard(savedIdx); } return; }
  show('deck-screen');
  { const dsb=document.getElementById('dev-screen-btn'); if(dsb) dsb.style.display=devMode?'flex':'none'; }
  requestAnimationFrame(layoutDecksRadial);
  setTimeout(layoutDecksRadial, 140); setTimeout(layoutDecksRadial, 450);   // re-run once the packs have settled to their final size
}

async function fixImages(html){
  return html.replace(/(<img[^>]+src\s*=\s*["'])([^"']+)(["'])/gi,(match,pre,src,post)=>{
    if(src.startsWith('data:')||src.startsWith('http')) return match;
    const filename=src.split('/').pop().split('?')[0];
    return mediaMap[filename]?`${pre}${mediaMap[filename]}${post}`:match;
  });
}
function saveGroups(){ localStorage.setItem('anki-groups',JSON.stringify(groups)); }
function extractBody(html){
  const styles=[];
  const stripped=html.replace(/<style[^>]*>([\s\S]*?)<\/style>/gi,(_,css)=>{ styles.push(css); return ''; }).replace(/<script[\s\S]*?<\/script>/gi,'').trim();
  return {body:stripped,css:styles.join('\n')};
}
function splitAnswerHtml(html){
  const m=html.match(/<hr[^>]*id\s*=\s*["']?answer["']?[^>]*>/i);
  if(!m) return {front:html,back:html};
  return {front:html.slice(0,m.index).trim(),back:html.slice(m.index+m[0].length).trim()};
}
function looksLikeOnlyExtra(html){ return /Information/i.test(html)&&!/cloze/i.test(html)&&!/<img/i.test(html)&&!/<svg/i.test(html)&&!/io-overlay|io-original|image-occlusion/i.test(html); }
function getField(card,names){ for(const n of names) if(card.fields&&card.fields[n]) return card.fields[n].value||''; return ''; }
function renderClozeText(text,showAnswers){
  let hasBullets=/^\s*•/m.test(text);
  let html=text.replace(/\{\{c\d+::([\s\S]*?)(?:::([\s\S]*?))?\}\}/g,(_,answer,hint)=>{
    const multiLine=/\r?\n/.test(answer)||/^\s*•/m.test(answer);
    if(!showAnswers) return `<span class="cloze-blank">${hint||'[...]'}</span>`;
    if(multiLine) return answer.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>`<div class="cloze-answer-line">${l}</div>`).join('');
    return `<span class="cloze-answer">${answer}</span>`;
  });
  if(hasBullets) return html.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>`<div class="enhanced-line">${l}</div>`).join('');
  return `<div class="enhanced-line">${html.replace(/\s*\r?\n\s*/g,' ')}</div>`;
}

function renderReviewDeckCard(deckName){
  const box=document.getElementById('review-deck-card'); if(!box) return;
  const shortName=deckName.replace('SOLUKKO::','');
  const moodleMatch=shortName.match(/\((https?:\/\/.*?)\)/);
  const moodleLink=moodleMatch?moodleMatch[1]:'#';
  const withoutUrl=shortName.replace(/\s*\(https?:\/\/[^)]*\)\s*/g,'');
  const courseCodeMatch=withoutUrl.match(/\(([^)]+)\)/);
  const courseCode=courseCodeMatch?courseCodeMatch[1]:'';
  const cleanName=withoutUrl.replace(/\s*\(.*?\)\s*/,'').trim();
  const bgVideo = cleanName + '.mp4';
  box.innerHTML=`<button class="deck-btn" style="width:var(--deck-card-width,260px)"><video class="deck-video" muted playsinline preload="metadata"><source src="${bgVideo}" type="video/mp4"><source src="default.mp4" type="video/mp4"></video><div style="position:relative;z-index:2"><div class="deck-title">${cleanName}</div><div style="font-size:14px;opacity:0.82;font-weight:400;">${courseCode}</div></div></button><a href="${moodleLink}" target="_blank" style="display:flex;align-items:center;gap:8px;text-decoration:none;background:#fffef9;border:1px solid #d4cec4;border-radius:10px;padding:0.5rem 0.8rem;font-family:'JetBrains Mono',monospace;font-size:0.72rem;color:#56533c;width:100%;box-shadow:0 2px 8px rgba(0,0,0,0.08);"><img src="moodlelogo.png" alt="Moodle" style="width:28px;height:28px;object-fit:contain;border-radius:5px;">Tarkista tenttiajankohdat Moodlesta</a>`;
  const btn=box.querySelector('.deck-btn'),video=box.querySelector('video');
  if(btn&&video){
    function _fitRDC(){ const bw=btn.offsetWidth,bh=btn.offsetHeight; if(!bw||!bh||!video.videoWidth) return; const s=Math.max(bw/video.videoWidth,bh/video.videoHeight); video.style.width=(video.videoWidth*s)+'px'; video.style.height=(video.videoHeight*s)+'px'; video.style.left=((bw-video.videoWidth*s)/2)+'px'; video.style.top=((bh-video.videoHeight*s)/2)+'px'; video.style.position='absolute'; }
    video.addEventListener('loadedmetadata',_fitRDC,{once:true});
    btn.addEventListener('mouseenter',()=>{ video.currentTime=0; video.play().catch(()=>{}); });
    btn.addEventListener('mouseleave',()=>{ video.pause(); video.currentTime=0; });
  }
}

let shuffleMode=false;
function shuffleDeck(){
  shuffleMode=!shuffleMode;
  document.getElementById('shuffle-btn')?.classList.toggle('active',shuffleMode);
  document.querySelectorAll('.peek-shuffle-btn').forEach(b=>b.classList.toggle('active',shuffleMode));
  if(shuffleMode){
    // randomise the order of the upcoming cards
    for(let i=queue.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=queue[i]; queue[i]=queue[j]; queue[j]=t; }
  } else {
    // restore the deck's original order from the current card onward
    const ci=currentCard?reviewCards.indexOf(currentCard):-1;
    queue=reviewCards.slice(ci+1);
  }
}

async function nextCard(){
  if(!queue.length){ showCelebration(); return; }
  stopMonaNotes();
  currentCard=queue.shift();
  currentOverviewIndex=reviewCards.indexOf(currentCard);
  await renderCurrentCard();
}

function escCmt(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function loadFirestoreComments(){
  const feed=document.getElementById('comment-feed'); if(!feed||!currentCard) return;

  feed.innerHTML='';
  const cardId=String(currentCard.cardId||currentCard.noteId||'');

    docs.forEach(doc=>{
      const d=doc.data(); const el=document.createElement('div'); el.className='comment-item'; el.dataset.docId=doc.id;
      const isOwn=d.userId&&d.userId===getUserId(); const canEdit=isOwn||devMode;

      feed.appendChild(el);
    });
  }, err=>{ feed.innerHTML=`<div style="font-family:JetBrains Mono,monospace;font-size:0.7rem;color:#c0392b;padding:4px;">Virhe: ${err.message}</div>`; });
}
async function openCardById(cardId){

  const ci=reviewCards.findIndex(c=>String(c.cardId)===cid||String(c.noteId)===cid);
  if(ci>=0) jumpToOverviewCard(ci);

async function endGameSession(){
  _lastBuzzerDocs=[]; _lastMoneyDocs=[];
  const display=document.getElementById('buzzer-display');
  if(display){ display.innerHTML=''; display.style.display='none'; }
  const signalAndDelete=async()=>{
    try{ await db.collection('gamestate').doc('current').set({mode:'ended',timestamp:firebase.firestore.FieldValue.serverTimestamp()}); }catch(e){}
    await new Promise(r=>setTimeout(r,800));
    const del=async(col)=>{ try{ const snap=await db.collection(col).get(); if(snap.empty) return; const b=db.batch(); snap.docs.forEach(d=>b.delete(d.ref)); await b.commit(); }catch(e){ console.error('delete',col,'failed:',e.message); } };
    await del('buzzers'); await del('joukkueet');
    try{ await db.collection('gamestate').doc('current').delete(); }catch(e){}
  };
  signalAndDelete();
}

function penaltyMoney(fromWord){
  if(!devMode) return;
  const others=_lastBuzzerDocs.map(d=>d.data().word).filter(w=>w!==fromWord);
  db.collection('joukkueet').doc(fromWord).set({ teamName:fromWord, money:firebase.firestore.FieldValue.increment(-0.10) },{merge:true});
  if(others.length){ const recipient=others[Math.floor(Math.random()*others.length)]; db.collection('joukkueet').doc(recipient).set({ teamName:recipient, money:firebase.firestore.FieldValue.increment(0.10) },{merge:true}); }

function showAnswer(){
  if(!currentCard||cardAnswerShown) return;
  cardAnswerShown=true;
  const fc=document.getElementById('flashcard');
  const reveal=()=>{
    fc.classList.remove('front-basic'); document.getElementById('question-content').style.fontSize='';   // back to normal size/flow for the answer
    if(currentCard._isSpecial){ document.getElementById('question-content').innerHTML=currentCard._aProcessed||currentCard._aHtml; document.getElementById('answer-section').style.display='none'; }
    else { document.getElementById('answer-section').style.display='block'; }
    document.getElementById('show-row').style.display='none';
    document.getElementById('grade-row').style.display='none';
    { const _p=document.getElementById('card-peek'); if(_p){ _p.style.visibility='hidden'; _p.classList.remove('peek-in','peek-out'); } }   // hidden on reveal
    clearTimeout(_backPeekTimer); _backPeekTimer=setTimeout(showBackPeek, 3000);   // bring the backside peeker in after 3s and keep it in view
    updateProgress();
    const pr=document.getElementById('progress-row'), ca=document.querySelector('.comment-area');
    pr.style.display='flex'; ca.style.display='flex';
    pr.classList.add('reveal-fade'); ca.classList.add('reveal-fade');   // start invisible, fade in shortly after the flip
    pr.classList.remove('shown'); ca.classList.remove('shown');
    clearTimeout(_revealFadeTimer);
    _revealFadeTimer=setTimeout(()=>{ pr.classList.add('shown'); ca.classList.add('shown'); },300);
  };
  clearTimeout(_cardPeekTimer); clearTimeout(_laajuusTimer);   // don't pop the top peeker in mid-flip
  const _pk=document.getElementById('card-peek');   // top peeker turns WITH the card (same vertical axis)
  if(_pk){ _pk.classList.remove('peek-in'); const cr=fc.getBoundingClientRect(), pr=_pk.getBoundingClientRect(); _pk.style.transformOrigin=((cr.left+cr.width/2)-pr.left)+'px 50%'; }
  // spin the card to reveal the answer (swap content while edge-on, so it never reads mirrored)
  fc.classList.remove('card-in-right','card-in-left','card-out-left','card-out-right','card-out-up');
  fc.style.animation='none';
  fc.style.transition='none';
  fc.style.transform='perspective(1000px) rotateY(0deg)';   // commit the start state so phase 1 actually animates
  if(_pk){ _pk.style.transition='none'; _pk.style.transform='perspective(1000px) rotateY(0deg)'; }
  void fc.offsetWidth;
  fc.style.transition='transform 0.2s ease-in';
  fc.style.transform='perspective(1000px) rotateY(90deg)';
  if(_pk){ _pk.style.transition='transform 0.2s ease-in'; _pk.style.transform='perspective(1000px) rotateY(90deg)'; }
  setTimeout(()=>{
    reveal();
    fc.style.transition='none';
    fc.style.transform='perspective(1000px) rotateY(-90deg)';
    void fc.offsetWidth;
    fc.style.transition='transform 0.2s ease-out';
    fc.style.transform='perspective(1000px) rotateY(0deg)';
    setTimeout(()=>{ fc.style.transition=''; fc.style.transform=''; fc.style.animation=''; },210);
  },200);
}

let _celebratedDeck=false;   // auto-show the celebration only once per deck session
function gradeCard(correct){
  if(coinAnimating) return;
  if(currentCard){ cardGrades[currentCard.cardId]=correct?'known':'unknown'; renderCardOverview(); updateProgress(); localStorage.setItem('solukko-grades-'+currentDeck,JSON.stringify(cardGrades)); }
  if(!correct){ _celebratedDeck=false; }   // marking a card "unknown" re-arms the celebration, so re-completing the deck shows it again
  const _allKnownNow = correct && reviewCards.length>0 && reviewCards.every(c=>cardGrades[c.cardId]==='known');   // did this "known" complete the deck?
  const fc=document.getElementById('flashcard');
  const ov=document.getElementById('card-overlay');
  const doNext=()=>{
    fc.classList.remove('card-out-left','card-out-right','card-out-up');
    if(ov){ ov.style.transition='none'; ov.style.opacity='0'; }
    if(_allKnownNow && !_celebratedDeck){ _celebratedDeck=true; showCelebration(); return; }   // deck just finished -> auto-show the celebration once
    if(correct&&groupMode){
      if(selectedGroup===null){ alert('Valitse ensin ryhmä, joka vastasi oikein.'); return; }
      const wg=selectedGroup; coinAnimating=true;
      animateCoinToGroup(wg,()=>{ groups[wg].score+=1; saveGroups(); updateGroupUI(); bounceWinningGroup(wg); setTimeout(()=>{ coinAnimating=false; selectedGroup=null; updateGroupUI(); nextCard(); },450); });
      return;
    }
    if(!correct){ queue.splice(Math.min(10,queue.length),0,currentCard); }
    selectedGroup=null; updateGroupUI(); nextCard();
  };
  const flyOut=()=>{                                  // only the card flies up; bar stays pinned at bottom
    if(ov){ if(correct){ ov.style.opacity='0'; } else { ov.style.transition='opacity 0.22s ease'; ov.style.background='rgba(0,0,0,0.5)'; ov.style.opacity='1'; } }   // no green tint on "yes"
    fc.classList.remove('card-in-right','card-in-left','card-out-left','card-out-right','card-out-up');
    fc.style.transition='none'; fc.style.transform=''; fc.style.animation='none';
    void fc.offsetWidth;
    fc.style.animation=''; fc.classList.add('card-out-up');
    setTimeout(doNext,280);
  };
  if(correct){                                        // "yes": glow the bar (no green card), then fly out
    const tube=document.querySelector('.progress-tube'), fill=document.getElementById('progress-fill');
    [tube,fill].forEach(el=>{ if(el){ el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); } });
    setTimeout(()=>{ [tube,fill].forEach(el=>el&&el.classList.remove('flash')); flyOut(); },1000);
  } else {
    flyOut();
  }
}

function getSubdeckName(card,parentDeck){
  const deck=card.deckName||'';
  if(deck===parentDeck||!deck.startsWith(parentDeck+'::')) return {name:'Pääpakka',link:null};
  const raw=deck.replace(parentDeck+'::','').split('::')[0];
  const vm=raw.match(/\((https?:\/\/.*?)\)/);
  return {name:raw.replace(/\s*\(https?:\/\/.*?\)\s*/,'').trim(),link:vm?vm[1]:null};
}
function naturalSubdeckSort(a,b){ if(a.name==='Pääpakka') return -1; if(b.name==='Pääpakka') return 1; return a.name.localeCompare(b.name,'fi',{numeric:true,sensitivity:'base'}); }
function buildDeckGroups(cards,parentDeck){
  const grps=[];
  cards.forEach(card=>{ const gi=getSubdeckName(card,parentDeck); let g=grps.find(x=>x.name===gi.name); if(!g){ g={name:gi.name,link:gi.link,cards:[]}; grps.push(g); } g.cards.push(card); });
  grps.sort(naturalSubdeckSort); return grps;
}

// FLIP-animate a grid into a new order of its card nodes
function flipReorderGrid(grid, newOrder){
  if(!grid) return;
  const first=new Map();
  [...grid.querySelectorAll('.overview-card')].forEach(n=>first.set(n, n.getBoundingClientRect()));
  newOrder.forEach(n=>grid.appendChild(n));
  newOrder.forEach(n=>{
    const f=first.get(n); if(!f) return;
    const l=n.getBoundingClientRect(), dx=f.left-l.left, dy=f.top-l.top;
    if(dx||dy){ n.style.transition='none'; n.style.transform='translate('+dx+'px,'+dy+'px)';
      requestAnimationFrame(()=>{ n.style.transition='transform 0.5s cubic-bezier(0.2,0.85,0.25,1)'; n.style.transform=''; });
      setTimeout(()=>{ n.style.transition=''; n.style.transform=''; }, 560);
    }
  });
}
function shuffleAllCards(){   // one button: scramble every section's cards, animated
  document.querySelectorAll('#card-overview-grid .overview-section-grid').forEach(grid=>{
    const cards=[...grid.querySelectorAll('.overview-card')];
    for(let i=cards.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=cards[i]; cards[i]=cards[j]; cards[j]=t; }
    flipReorderGrid(grid, cards);
  });
}

function updateGroupUI(){
  const board=document.getElementById('group-scoreboard'), addBtn=document.querySelector('.group-tools');
  const mt=document.getElementById('mode-toggle-input2'); if(mt) mt.checked=groupMode;
  if(!board) return;
  if(groupMode){ board.classList.remove('disabled'); if(addBtn) addBtn.style.display='flex'; }
  else { board.classList.add('disabled'); selectedGroup=null; if(addBtn) addBtn.style.display='none'; }
  board.innerHTML='';
  groups.forEach((group,index)=>{
    const card=document.createElement('div'); card.className='group-card'+(groupMode&&selectedGroup===index?' selected':'');
    card.onclick=()=>selectGroup(index);
    const name=document.createElement('div'); name.className='group-name'; name.textContent=group.name; name.ondblclick=e=>{ e.stopPropagation(); renameGroup(index); };
    const tower=document.createElement('div'); tower.className='coin-tower'; tower.id=`coin-tower-${index}`; tower.style.minHeight=Math.max(70,group.score*8+28)+'px';
    for(let c=0;c<group.score;c++){ const coin=document.createElement('div'); coin.className='coin'; coin.style.bottom=(c*8)+'px'; tower.appendChild(coin); }
    const money=document.createElement('div'); money.className='group-money'; money.textContent=`${(group.score*.10).toFixed(2)} €`;
    card.appendChild(name); card.appendChild(tower); card.appendChild(money); board.appendChild(card);
  });
}

function animateCoinToGroup(groupIndex,callback){
  const rightBtn=document.getElementById('right-btn'), tower=document.getElementById(`coin-tower-${groupIndex}`);
  if(!rightBtn||!tower){ callback(); return; }
  const start=rightBtn.getBoundingClientRect(), end=tower.getBoundingClientRect();
  const coin=document.createElement('div'); coin.className='flying-coin';
  const sx=start.left+start.width/2-23, sy=start.top+start.height/2-9;
  const ex=end.left+end.width/2-23, ey=end.bottom-18-(groups[groupIndex].score*8);
  coin.style.left=sx+'px'; coin.style.top=sy+'px';
  document.body.appendChild(coin);
  const dx=ex-sx, dy=ey-sy;
  const anim=coin.animate([
    {transform:'translate(0,0) rotateX(0deg) rotateY(0deg) scale(1)',offset:0},
    {transform:`translate(${dx*.45}px,${dy-90}px) rotateX(180deg) rotateY(240deg) scale(1.25)`,offset:.55},
    {transform:`translate(${dx}px,${dy}px) rotateX(360deg) rotateY(720deg) scale(1)`,offset:1}
  ],{duration:650,easing:'cubic-bezier(.2,.8,.2,1)'});
  anim.onfinish=()=>{ coin.remove(); playCashSound(); callback(); };
}

(function initCardTap(){
  const fc=document.getElementById('flashcard');
  const overlay=document.createElement('div');         // kept: gradeCard tints this on grading
  overlay.id='card-overlay';
  overlay.style.cssText='position:absolute;inset:0;border-radius:12px;pointer-events:none;opacity:0;z-index:10;transition:none;';
  fc.appendChild(overlay);

  let pressT=0, sx=0, sy=0, swiped=false;
  fc.addEventListener('mousedown',e=>{ if(e.button===0) pressT=Date.now(); });
  fc.addEventListener('touchstart',e=>{ pressT=Date.now(); const t=e.touches[0]; if(t){ sx=t.clientX; sy=t.clientY; } swiped=false; },{passive:true});
  fc.addEventListener('touchend',e=>{                       // horizontal swipe reveals the answer
    const t=e.changedTouches[0]; if(!t) return;
    const dx=t.clientX-sx, dy=t.clientY-sy;
    if(Math.abs(dx)>40 && Math.abs(dx)>Math.abs(dy)*1.2){
      swiped=true;
      if(!cardAnswerShown && !e.target.closest('.word-link')) showAnswer();
    }
  },{passive:true});

  fc.addEventListener('click',e=>{
    if(!currentCard) return;                               // celebration / done screen: no reveal or shake
    if(e.target.closest('.word-link')){ e.stopPropagation(); return; }
    if(swiped){ swiped=false; return; }                    // swipe already handled the reveal
    if(!cardAnswerShown){ showAnswer(); return; }          // front: tap reveals the answer
    if(Date.now()-pressT<=400) shakeCard();                // back: quick tap shakes; long press does nothing
  });

  document.addEventListener('keydown',e=>{
    if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT') return;
    if(e.key==='ArrowRight'&&cardAnswerShown) gradeCard(true);
    if(e.key==='ArrowLeft' &&cardAnswerShown) gradeCard(false);
    if((e.key===' '||e.key==='Enter')&&!cardAnswerShown&&currentCard){ e.preventDefault(); showAnswer(); }
  });
})();

function shakeCard(){
  const fc=document.getElementById('flashcard'); if(!fc) return;
  fc.classList.remove('card-shake'); void fc.offsetWidth; fc.classList.add('card-shake');
  setTimeout(()=>fc.classList.remove('card-shake'),500);
  const pr=document.getElementById('progress-row'), ca=document.querySelector('.comment-area');   // make sure the answer buttons show
  if(pr){ pr.style.display='flex'; pr.classList.remove('reveal-fade'); pr.classList.add('shown'); }
  if(ca){ ca.style.display='flex'; ca.classList.remove('reveal-fade'); ca.classList.add('shown'); }
  fitCardScale(); scrollToCard();   // re-lay out exactly like a fresh card load, leaving room for the buttons
  document.querySelectorAll('#progress-row .ball-btn').forEach(b=>{   // draw attention to the grade buttons
    b.classList.remove('btn-attention'); void b.offsetWidth; b.classList.add('btn-attention');
    setTimeout(()=>b.classList.remove('btn-attention'),700);
  });
}

let _lastResizeW=window.innerWidth;
window.addEventListener('resize',()=>{
  if(window.innerWidth===_lastResizeW) return;   // ignore height-only changes (mobile URL bar) to avoid jumpiness
  _lastResizeW=window.innerWidth;
  fitCardScale(); positionCommentArea(); fitDeckTitle(); layoutDecksRadial();
});

// Height of the *visible* viewport — excludes the mobile browser's URL/search bar
function viewportH(){ return (window.visualViewport && window.visualViewport.height) || window.innerHeight; }

// Robust mobile detection: touch-first pointer or a mobile user-agent (not just a narrow/portrait window)
function isMobile(){
  return (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) || /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent||'');
}
document.body.classList.toggle('is-mobile', isMobile());

// Space the grade/eye buttons need at the bottom, so the card never overlaps them
function bottomReserve(){
  const pr=document.getElementById('progress-row');
  let h=0;
  if(pr&&pr.offsetParent) h=pr.offsetHeight;
  return (h||46) + 40;   // button height + bottom inset + gap
}
// Height available for the card (viewport minus the bottom button area)
function cardViewportH(){ return viewportH() - bottomReserve(); }

// Uniformly scale the whole card (and its text) down so it fits the viewport AND the buttons
function fitCardScale(){
  const wrap=document.getElementById('flashcard-wrap'), fc=document.getElementById('flashcard');
  if(!wrap||!fc) return;
  wrap.style.transform=''; wrap.style.marginBottom='';
  const cs=document.getElementById('card-screen');
  const _zoom=(window.visualViewport&&window.visualViewport.scale)||1;   // pinch-zoom factor (1 = no zoom)
  const availH=Math.max(180, (viewportH()*_zoom - bottomReserve())-16);   // when zoomed in, size to the un-zoomed height so the zoom enlarges the card instead of shrinking it back to fit
  const availW=Math.max(180, (cs?cs.clientWidth:wrap.clientWidth)-4);
  const w=Math.min(availW, availH/1.5), h=w*1.5;                         // vertical card (1 : 1.5) on all devices
  fc.style.height=Math.round(h)+'px';
  wrap.style.width=Math.round(w)+'px';                                   // content scrolls inside if it overflows
}
// Basic-card front: centred, 3x-bigger question; drop to 2x only if 3x doesn't fit (no other sizes)
function fitFrontText(){
  const fc=document.getElementById('flashcard'), q=document.getElementById('question-content');
  if(!fc||!q) return;
  fc.classList.remove('front-basic'); q.style.fontSize='';
  if(!currentCard || currentCard._isSpecial || cardAnswerShown) return;
  fc.classList.add('front-basic');
  q.style.fontSize='3.6rem';                                              // 3x
  if(fc.scrollHeight>fc.clientHeight+1 || q.scrollWidth>q.clientWidth+1) q.style.fontSize='2.4rem';   // 2x fallback
}

function scrollToCard(smooth){
  const fc=document.getElementById('flashcard'), cs=document.getElementById('card-screen');
  if(!fc||!cs) return;
  const vpH=cardViewportH(), fcH=fc.getBoundingClientRect().height;
  const fcOffsetInCS=fc.getBoundingClientRect().top-cs.getBoundingClientRect().top;
  cs.style.marginTop=Math.max(0,(vpH-fcH)/2-fcOffsetInCS+24)+'px';
  const fcDocTop=fc.getBoundingClientRect().top+window.scrollY;
  const scrollTop=fcH>=vpH ? Math.max(0,fcDocTop-24) : Math.max(0,fcDocTop-(vpH-fcH)/2);
  const grid=document.getElementById('card-overview-grid');
  if(grid){ grid.style.marginTop=Math.max(16,(scrollTop+vpH)-(fcDocTop+fcH)+24)+'px'; }
  window.scrollTo({top:scrollTop,behavior:smooth?'smooth':'instant'});
  positionCommentArea();
}

let _wordLinks=[];
function _escapeReg(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }

function buildWordLinks(){
  _wordLinks=[];
  const seen=new Set();

  // Pass 1: front-field text (existing behaviour)
  reviewCards.forEach((card,idx)=>{
    const q=getField(card,['Front','front','Question','question','Text','text','Content','content'])||card.question||'';
    const clean=q.replace(/<[^>]*>/g,' ').replace(/\{\{c\d+::(.*?)(?:::.*?)?\}\}/g,'$1').replace(/&[a-z]+;/gi,' ').replace(/\s+/g,' ').trim();
    if(!clean||clean.length<2) return;
    if(clean.split(/\s+/).length>4) return;
    const lower=clean.toLowerCase();
    if(seen.has(lower)) return;
    seen.add(lower);
    _wordLinks.push({text:clean,lower,cardIndex:idx});
  });

  // Pass 2: tags — each tag on a card becomes an extra link trigger for that card
  reviewCards.forEach((card,idx)=>{
    (card.tags||[]).forEach(tag=>{
      if(/^[★\s*]+$/.test(tag)) return;
      const clean=tag.replace(/_/g,' ').trim();
      if(!clean||clean.length<2) return;
      const lower=clean.toLowerCase();
      if(seen.has(lower)) return;
      seen.add(lower);
      _wordLinks.push({text:clean,lower,cardIndex:idx});
    });
  });

  _wordLinks.sort((a,b)=>b.text.length-a.text.length);
}

function _wrapTextNode(textNode){
  const text=textNode.textContent;
  const matches=[];
  _wordLinks.forEach(link=>{
    if(link.cardIndex===currentOverviewIndex) return;
    const re=new RegExp('(?<![\\wäöåÄÖÅ-])'+_escapeReg(link.text)+'(?![\\wäöåÄÖÅ-])','gi');
    let m; while((m=re.exec(text))!==null) matches.push({start:m.index,end:m.index+m[0].length,text:m[0],cardIndex:link.cardIndex});
  });
  if(!matches.length) return;
  matches.sort((a,b)=>a.start-b.start||(b.end-b.start)-(a.end-a.start));
  const filtered=[]; let lastEnd=0;
  matches.forEach(m=>{ if(m.start>=lastEnd){ filtered.push(m); lastEnd=m.end; } });
  const frag=document.createDocumentFragment(); let pos=0;
  filtered.forEach(m=>{ if(m.start>pos) frag.appendChild(document.createTextNode(text.slice(pos,m.start))); const span=document.createElement('span'); span.className='word-link'; span.dataset.cardIndex=m.cardIndex; span.textContent=m.text; frag.appendChild(span); pos=m.end; });
  if(pos<text.length) frag.appendChild(document.createTextNode(text.slice(pos)));
  textNode.parentNode.replaceChild(frag,textNode);
}

// Dim text inside parentheses to 50% opacity
function dimParentheses(element){
  if(!element) return;
  const walker=document.createTreeWalker(element,NodeFilter.SHOW_TEXT,{
    acceptNode(node){ let p=node.parentElement; while(p&&p!==element){ if(p.classList&&(p.classList.contains('word-link')||p.classList.contains('dim-paren')||p.classList.contains('cloze-blank'))) return NodeFilter.FILTER_REJECT; p=p.parentElement; } return /\([^()]*\)/.test(node.textContent)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT; }
  });
  const nodes=[]; let n; while((n=walker.nextNode())) nodes.push(n);
  nodes.forEach(textNode=>{
    const text=textNode.textContent; const re=/\([^()]*\)/g; let m, last=0; const frag=document.createDocumentFragment();
    while((m=re.exec(text))!==null){
      if(m.index>last) frag.appendChild(document.createTextNode(text.slice(last,m.index)));
      const span=document.createElement('span'); span.className='dim-paren'; span.textContent=m[0]; frag.appendChild(span);
      last=m.index+m[0].length;
    }
    if(last<text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    textNode.parentNode.replaceChild(frag,textNode);
  });
}

function applyWordLinks(element){
  if(!_wordLinks.length||!element) return;
  const walker=document.createTreeWalker(element,NodeFilter.SHOW_TEXT,{
    acceptNode(node){ let p=node.parentElement; while(p&&p!==element){ if(p.classList&&(p.classList.contains('word-link')||p.classList.contains('cloze-blank'))) return NodeFilter.FILTER_REJECT; p=p.parentElement; } return node.textContent.trim()?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT; }
  });
  const nodes=[]; let n; while((n=walker.nextNode())) nodes.push(n);
  nodes.forEach(_wrapTextNode);
}

(function initWordLinkTooltip(){
  const tip=document.createElement('div'); tip.id='word-link-tooltip'; document.body.appendChild(tip);
  let touchPinnedLink=null;

  function prepareTooltipHtml(html){ html=String(html||''); html=html.replace(/src="([^"]+)"/gi,(m,src)=>{ return mediaMap[src]?`src="${mediaMap[src]}"`:m; }); return html; }

  function showTip(target){
    const idx=parseInt(target.dataset.cardIndex); if(isNaN(idx)) return;
    const card=reviewCards[idx]; if(!card) return;
    const front=getField(card,['Front','front','Question','question','Text','text','Content','content'])||card.question||'';
    const back=getField(card,['Back','back','Answer','answer','Extra','extra'])||card.answer||'';
    tip.innerHTML='<div style="font-weight:700;margin-bottom:0.6rem;">'+prepareTooltipHtml(front)+'</div><div>'+prepareTooltipHtml(back)+'</div>';
    tip.style.display='block'; tip.style.width='min(520px, calc(100vw - 24px))';
    const r=target.getBoundingClientRect(), tw=tip.offsetWidth, th=tip.offsetHeight, vw=window.innerWidth, vh=window.innerHeight;
    let l=r.left, t=r.bottom+8;
    if(l+tw>vw-12) l=vw-tw-12;
    if(t+th>vh-12) t=r.top-th-8;
    tip.style.left=Math.max(8,l)+'px'; tip.style.top=Math.max(8,t)+'px';
  }

  function updateTip(){
    const hovered=document.querySelector('.word-link:hover');
    if(touchPinnedLink){ showTip(touchPinnedLink); }
    else if(hovered){ showTip(hovered); }
    else { tip.style.display='none'; }
    requestAnimationFrame(updateTip);
  }
  requestAnimationFrame(updateTip);

  let _lpTimer=null;                                          // mobile: only a long-press shows the bubble
  document.addEventListener('touchstart', e=>{
    const link=e.target.closest('.word-link'); if(!link) return;
    _lpTimer=setTimeout(()=>{ touchPinnedLink=link; showTip(link); _lpTimer=null; }, 450);
  }, {passive:true});
  document.addEventListener('touchmove', ()=>{ if(_lpTimer){ clearTimeout(_lpTimer); _lpTimer=null; } }, {passive:true});
  document.addEventListener('touchend', e=>{
    if(_lpTimer){ clearTimeout(_lpTimer); _lpTimer=null; }    // released before the long-press → just a tap, ignore
    const link=e.target.closest('.word-link');
    if(touchPinnedLink && link!==touchPinnedLink){ touchPinnedLink=null; tip.style.display='none'; }   // tap away closes it
  }, {passive:true});
})();

(function initStarTooltip(){
  const tip = document.createElement('div');
  tip.id = 'star-tooltip';
  document.body.appendChild(tip);

  function show(target){
    const text = target.dataset.starMeaning;
    if(!text) return;
    tip.textContent = text;
    tip.style.display = 'block';
    const r = target.getBoundingClientRect();
    const tw = tip.offsetWidth;
    let l = r.left + r.width / 2 - tw / 2;
    let t = r.top - tip.offsetHeight - 6;
    if(l + tw > window.innerWidth - 8) l = window.innerWidth - tw - 8;
    if(l < 8) l = 8;
    if(t < 8) t = r.bottom + 6;
    tip.style.left = l + 'px';
    tip.style.top  = t + 'px';
  }

  function hide(){ tip.style.display = 'none'; }

  document.addEventListener('mouseover', e => {
    const stars = e.target.closest('#card-stars');
    if(stars && stars.dataset.starMeaning) show(stars); else hide();
  });

  let _tipPinned = false;
  document.addEventListener('touchend', e => {
    const stars = e.target.closest('#card-stars');
    if(stars && stars.dataset.starMeaning){
      _tipPinned = !_tipPinned;
      if(_tipPinned) show(stars); else hide();
    } else if(_tipPinned){
      _tipPinned = false; hide();
    }
  }, {passive:true});
})();
