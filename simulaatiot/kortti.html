<script>
'use strict';

const BOND_R    = 0.10;  // stick radius (Å) — thinner than the smallest ball
const GAP_FRAC  = 0.15;  // side-by-side gap as a fraction of mean model width
const FILL_SCALE = 0.72; // space-filling sphere size as a fraction of vdW radius (tightened so the surface ≈ the orbital cloud, not much bigger)

/* ── Standard CPK-ish colours (c), ball radii (r) + van der Waals radii (vr), Å.
      C dark grey, H light grey.  vr drives the space-filling surface mode.  ── */
/* n = nucleon count (mass number) → nucleus size; z = proton count; en = Pauling electronegativity (bond polarity). */
const ELEM = {
  H :{c:[0.88,0.88,0.88], r:0.23, vr:1.10, n:1,  z:1 , en:2.20},   C :{c:[0.42,0.42,0.42], r:0.32, vr:1.70, n:12, z:6 , en:2.55},
  N :{c:[0.19,0.31,0.97], r:0.31, vr:1.55, n:14, z:7 , en:3.04},   O :{c:[0.94,0.15,0.15], r:0.30, vr:1.52, n:16, z:8 , en:3.44},
  S :{c:[1.00,0.78,0.16], r:0.38, vr:1.80, n:32, z:16, en:2.58},   P :{c:[1.00,0.50,0.00], r:0.38, vr:1.80, n:31, z:15, en:2.19},
  MG:{c:[0.33,0.78,0.33], r:0.42, vr:1.73, n:24, z:12, en:1.31},   FE:{c:[0.88,0.40,0.20], r:0.42, vr:1.56, n:56, z:26, en:1.83},
  MN:{c:[0.61,0.48,0.78], r:0.42, vr:1.61, n:55, z:25, en:1.55},   CA:{c:[0.24,0.80,0.24], r:0.46, vr:1.97, n:40, z:20, en:1.00},
  ZN:{c:[0.49,0.51,0.69], r:0.40, vr:1.39, n:65, z:30, en:1.65},   CU:{c:[0.78,0.50,0.20], r:0.40, vr:1.40, n:64, z:29, en:1.90},
  CL:{c:[0.24,0.94,0.24], r:0.36, vr:1.75, n:35, z:17, en:3.16},   NA:{c:[0.67,0.36,0.95], r:0.46, vr:2.27, n:23, z:11, en:0.93},
  K :{c:[0.56,0.25,0.83], r:0.52, vr:2.75, n:39, z:19, en:0.82},   CO:{c:[0.94,0.56,0.63], r:0.42, vr:1.52, n:59, z:27, en:1.88},
  FB:{c:[0.55,0.55,0.55], r:0.32, vr:1.60, n:12, z:6 , en:2.50},
};
const info = code => ELEM[EL_LIST[code]] || ELEM.FB;
/* Full element names (shown big in the config panel; the symbol is no longer displayed there). */
const ELEM_NAME = {
  H:'Hydrogen', C:'Carbon', N:'Nitrogen', O:'Oxygen', S:'Sulfur', P:'Phosphorus',
  MG:'Magnesium', FE:'Iron', MN:'Manganese', CA:'Calcium', ZN:'Zinc', CU:'Copper',
  CL:'Chlorine', NA:'Sodium', K:'Potassium', CO:'Cobalt', FB:'Atom',
};
const elemName = code => ELEM_NAME[EL_LIST[code]] || EL_LIST[code] || 'Atom';
/* Finnish element names → the panel title reads "<name>atomi" (e.g. Hiili → "Hiiliatomi"). */
const ELEM_NAME_FI = {
  H:'Vety', C:'Hiili', N:'Typpi', O:'Happi', S:'Rikki', P:'Fosfori',
  MG:'Magnesium', FE:'Rauta', MN:'Mangaani', CA:'Kalsium', ZN:'Sinkki', CU:'Kupari',
  CL:'Kloori', NA:'Natrium', K:'Kalium', CO:'Koboltti',
};
const elemNameFi = code => { const n = ELEM_NAME_FI[EL_LIST[code]];
  if(!n) return 'Atomi';
  return n + (/a$/i.test(n) ? '-' : '') + 'atomi';   // "Rauta" → "Rauta-atomi" (a+a needs a hyphen), else just append
};

/* ── Element registry (symbol ↔ small integer code) ───────────────────── */
const EL_CODE = new Map(), EL_LIST = [];
function codeOf(sybyl){
  const dot = sybyl.indexOf('.');
  let sym = (dot === -1 ? sybyl : sybyl.slice(0, dot)).toUpperCase();
  if(!ELEM[sym]) sym = 'FB';
  let c = EL_CODE.get(sym);
  if(c === undefined){ c = EL_LIST.length; EL_CODE.set(sym, c); EL_LIST.push(sym); }
  return c;
}

/* Black-screen diagnostic. A throw during setup, a rejected promise, or a shader that fails to compile
   are all INVISIBLE when they happen — the canvas simply stays empty and the chrome still draws, which
   looks exactly like a black screen with nothing wrong. Put them on the page instead. */
(function(){
  const show = msg => { let b = document.getElementById('errbar');
    if(!b){ b = document.createElement('div'); b.id = 'errbar';
      b.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:99999;background:#7a1d1d;color:#fff;'
        + 'font:12px/1.45 ui-monospace,monospace;padding:8px 12px;white-space:pre-wrap;max-height:45vh;overflow:auto';
      (document.body || document.documentElement).appendChild(b); }
    if(b.textContent.length < 4000) b.textContent += (b.textContent ? String.fromCharCode(10) : '') + msg; };
  addEventListener('error', e => show('VIRHE: ' + e.message + '   (' + String(e.filename||'').split('/').pop() + ':' + e.lineno + ')'));
  addEventListener('unhandledrejection', e => show('VIRHE (promise): ' + ((e.reason && e.reason.message) || e.reason)));
  const ce = console.error;
  console.error = function(){ const t = Array.from(arguments).map(String).join(' ');
    if(/error|fail|compil|link|shader|WebGL/i.test(t)) show('KONSOLI: ' + t.slice(0, 600));
    return ce.apply(console, arguments); };
  window.__showErr = show;
})();

/* The first 5 seconds belong to Mona - the real build messages are held back until then and the one
   that was current when the hush lifts is what appears. */
let gLoadMsg = '', gLoadHush = true;
const paintLbl = () => { const e = document.getElementById('load-lbl'); if(e) e.textContent = gLoadHush ? 'Hys! Mona nukkuu.' : gLoadMsg;
  const m = document.getElementById('mini-lbl'); if(m) m.textContent = gLoadMsg; };
const setLbl = t => { gLoadMsg = t; paintLbl(); };
setTimeout(() => { gLoadHush = false; paintLbl(); }, 5000);
{ const eb = document.getElementById('load-enter'); if(eb) eb.addEventListener('click', () => { if(!gBarDone){ const ml = document.getElementById('miniload'); if(ml) ml.hidden = false; } }); }   // the loading screen dropped early: the small bar takes over
paintLbl();
/* The bar NEVER stalls. Each progress mark restarts a slow linear GLIDE from wherever the bar has got
   to, aimed most of the way to full but never at it — and because that glide is a CSS transition the
   compositor owns, it keeps moving even while a build step has the main thread locked solid, which no
   JS timer or rAF loop can do. Only the final mark actually fills it.
   (Call sites pass either a fraction or a percent — both are accepted.) */
let gBarMark = 0, gBarDone = false;
const barNow = e => { try { return new DOMMatrixReadOnly(getComputedStyle(e).transform).a; } catch(_){ return gBarMark; } };
const setBar = v => {
  const f = Math.max(0, Math.min(1, v > 1 ? v/100 : v));
  const e = document.getElementById('load-bar'); if(!e || gBarDone) return;
  const mb = document.getElementById('mini-bar');   // the bottom-centre twin (shown by 'Käynnistä keskeneräisenä'), same glide
  if(f >= 1){ gBarDone = true; for(const el of [e, mb]) if(el){ el.style.transition = 'transform .4s ease-out'; el.style.transform = 'scaleX(1)'; }
    setTimeout(() => { const ml = document.getElementById('miniload'); if(ml) ml.hidden = true; }, 900); return; }
  gBarMark = Math.max(f, barNow(e));           // never step BACKWARD past where the glide already reached
  for(const el of [e, mb]){ if(!el) continue;
    el.style.transition = 'none';                  // pin it there…
    el.style.transform = 'scaleX(' + gBarMark.toFixed(4) + ')';
    void el.offsetWidth;                           // …commit that before starting the next glide
    el.style.transition = 'transform 45s linear';
    el.style.transform = 'scaleX(' + (gBarMark + (0.96 - gBarMark)*0.7).toFixed(4) + ')'; }
};
setBar(0);   // start gliding the moment the page opens
const yield_ = () => new Promise(r => setTimeout(r, 0));
/* ── Background preload (owner, 2026-09-09): every model file is fetched the moment the page opens - on the
   start screen too - and parsed one at a time with a breath between, so whichever mode is chosen finds its
   models already here. The viewer and the editor both take the parsed molecules (only one mode runs per page,
   so the viewer may mutate them). Anything not on the list still goes through the same functions on demand. */
const PRE_FILES = ['PSII.mol2','photosystem_I.mol2','cytochrome_b6f.mol2','ATP_synthase.mol2','NDH-1.mol2',
  'ferredoxin.mol2','FNR.mol2','RuBisCO.mol2','plastocyanin.mol2','PGR5.mol2',
  'PGRL1.mol2','PPH1.mol2','STN7.mol2','Violaxanthin_de-epoxidase.mol2','Zeaxanthin_epoxidase.mol2','chlorophyll.mol2','quinone.mol2','nadph.mol2'];
const gPreText = new Map(), gPreParsed = new Map();
const preText = fn => { let p = gPreText.get(fn); if(!p){ p = fetch('./' + fn).then(r => r.ok ? r.text() : null).catch(() => null); gPreText.set(fn, p); } return p; };
const preParsed = fn => { let p = gPreParsed.get(fn); if(!p){ p = preText(fn).then(t => t === null ? null : parseMol2(t)); gPreParsed.set(fn, p); } return p; };
if(false)   // the card popup loads only its own species
(async () => { for(const fn of PRE_FILES) preText(fn);                       // the downloads, all at once
  for(const fn of PRE_FILES){ await preParsed(fn); await yield_(); } })();     // the parses, one by one

/* ── Goodsell-style muted palette, coloured by molecular component ─────── */
const CAT_COLORS = [
  [0.52,0.47,0.27],   // 0 protein     — muted olive/khaki
  [0.30,0.48,0.28],   // 1 chlorophyll — muted green
  [0.86,0.47,0.17],   // 2 carotenoid  — orange
  [0.60,0.22,0.18],   // 3 heme        — rust red
  [0.72,0.63,0.39],   // 4 lipid       — tan
  [0.52,0.55,0.62],   // 5 metal/ion   — slate
  [0.60,0.55,0.44],   // 6 other       — neutral tan
];
const RES_CAT = {};
'ALA ARG ASN ASP CYS GLN GLU GLY HIS ILE LEU LYS MET PHE PRO SER THR TRP TYR VAL HOH'.split(' ').forEach(r=>RES_CAT[r]=0);
'CHL CLA PHO BCL'.split(' ').forEach(r=>RES_CAT[r]=1);
'BCR LUT NEX XAT VIO ZEA ECH'.split(' ').forEach(r=>RES_CAT[r]=2);   // ECH = echinenone (b6f)
'HEM HEC'.split(' ').forEach(r=>RES_CAT[r]=3);
'DGD LMG LHG PL9 SQD LMT 6PL PGV LFA'.split(' ').forEach(r=>RES_CAT[r]=4);   // 6PL/PGV/LFA = b6f phospholipids + fatty acid
'CL FE2 FE MG MN CA NA K ZN OEX BCT CU CO'.split(' ').forEach(r=>RES_CAT[r]=5);
const catOf = res => RES_CAT[res] ?? 6;
// Electron-transport-chain cofactors → flagged so a button can render them on top of everything.
// The FULL light-harvesting + electron-transport set: every chlorophyll (antenna AND reaction-centre —
// P680/P700 can't be told apart from antenna Chl in this data), every carotenoid, the quinones, hemes,
// pheophytins, metal clusters, and Tyr Z (tagged geometrically in markTyrZ — it's a plain TYR residue,
// identified as the one hydrogen-bonded to the OEC).
// Each cofactor residue → a TYPE code (1-9) so the overlay can colour them by role, in vivid hues
// that stand out from the muted parent-model palette.
const ETC_RES = { OEX:1, MN:1, CA:1,   PHO:2,   PL9:3, PQN:3, PQ9:3, UQ:3,   HEM:4, HEC:4,
  SF4:5, FES:5, F3S:5, FE:5, FE2:5,   CU:6,
  CLA:7, CHL:7, BCL:7, CL0:7,                                   // chlorophylls (antenna + reaction centre)
  BCR:8, LUT:8, NEX:8, XAT:8, VIO:8, ZEA:8, LU2:8, A86:8, ECH:8,   // carotenoids (ECH = echinenone, b6f)
  NAP:10, NDP:10, NADP:10 };   // 10 = NADP+ / NADPH (FNR)
const ETC_TYRZ = 9;                                             // assigned geometrically, not by residue name
// The four real thylakoid membrane lipids, by their PDB residue names. MGDG and DGDG are the
// galactolipids (uncharged sugar heads) that dominate the bilayer, SQDG carries a sulfonate head
// and PG is the ONLY one with a phosphate head — so a realistic mix shows all four head groups.
const LIPID_RES = { LMG:1, DGD:2, SQD:3, LHG:4 };
// Every cofactor type is one of five bright hues: RED, GREEN, CORAL, BLUE, PINK.
const _RED=[1.00,0.16,0.16], _GRN=[0.16,0.90,0.36], _COR=[1.00,0.50,0.34], _BLU=[0.28,0.56,1.00], _PNK=[1.00,0.42,0.80], _ORG=[1.00,0.58,0.10], _BABY=[0.54,0.81,0.94];   // _BABY = baby blue (#89CFF0)
/* One stable colour per MOLECULE (residue instance). Hashing the id spreads neighbouring residues to
   far-apart hues, so two chlorophylls sitting side by side never come out the same shade, while every
   atom of one molecule shares exactly one colour - which is what makes the grouping readable. */
function molCol(id){
  let h = (id ^ (id >>> 16)) >>> 0;
  h = (Math.imul(h, 2246822519) ^ (h >>> 13)) >>> 0;
  h = (Math.imul(h, 3266489917) ^ (h >>> 16)) >>> 0;
  const hue = (h >>> 8) / 16777216, sat = 0.55, lig = 0.62;
  const c = (1 - Math.abs(2*lig - 1)) * sat, x = c * (1 - Math.abs(((hue*6) % 2) - 1)), m = lig - c/2;
  const seg = Math.floor(hue*6) % 6;
  const rgb = [[c,x,0],[x,c,0],[0,c,x],[0,x,c],[x,0,c],[c,0,x]][seg];
  return [rgb[0]+m, rgb[1]+m, rgb[2]+m];
}
const ETC_COL = [ [0,0,0],   // 0 unused
  _BABY,  // 1 OEC (Mn₄CaO₅)        — baby blue (was coral, owner's request 2026-09-07)
  _PNK,   // 2 pheophytin           — pink
  _BLU,   // 3 plasto/phyllo-quinone — blue
  _RED,   // 4 heme                  — red
  _GRN,   // 5 Fe-S cluster          — green
  _BLU,   // 6 Cu (plastocyanin)     — blue
  _GRN,   // 7 chlorophyll           — green
  _ORG,   // 8 carotenoid            — orange
  _PNK,   // 9 Tyr Z (D1-Tyr161)     — pink
  _PNK ]; // 10 NADPH (FNR)          — pink

/* ── Parse a multi-molecule mol2 into typed-array records ──────────────── */
function parseMol2(text){
  const lines = text.split('\n');
  const mols = [];
  let cur = null, section = '';
  for(let i = 0; i < lines.length; i++){
    const ln = lines[i];
    if(ln.charCodeAt(0) === 64){                 // '@' → section marker
      const t = ln.trim();
      if(t === '@<TRIPOS>MOLECULE'){ cur = {name:null}; mols.push(cur); section = 'HDR'; }
      else if(t === '@<TRIPOS>ATOM')  section = 'ATOM';
      else if(t === '@<TRIPOS>BOND')  section = 'BOND';
      else section = 'OTHER';
      continue;
    }
    if(section === 'HDR'){
      if(cur.name === null){ cur.name = ln.trim(); }
      else if(cur.na === undefined){
        const p = ln.trim().split(/\s+/);
        cur.na = +p[0]; cur.nb = +p[1] || 0;
        cur.x  = new Float32Array(cur.na); cur.y = new Float32Array(cur.na);
        cur.z  = new Float32Array(cur.na); cur.el = new Uint16Array(cur.na); cur.ai = 0;
        cur.cat = new Uint8Array(cur.na);
        cur.cof = new Uint8Array(cur.na);  // 1 = electron-transport-chain cofactor (for the render-on-top overlay)
        cur.sid = new Int32Array(cur.na);  // subst_id (residue instance) → to extract one chlorophyll
        cur.tyr = new Uint8Array(cur.na);  // 1 = atom of a TYR residue → markTyrZ picks the one beside the OEC
        cur.lip = new Uint8Array(cur.na);  // LIPID_RES code → lets the bilayer tile a real MGDG/DGDG/SQDG/PG mixture
        cur.b1 = new Int32Array(cur.nb);   cur.b2 = new Int32Array(cur.nb);  cur.bi = 0;
        cur.bo = new Uint8Array(cur.nb);   // bond order (1 single, 2 double, 3 triple)
      }
      continue;
    }
    if(section === 'ATOM'){
      const p = ln.trim().split(/\s+/);
      if(p.length < 6 || cur.ai >= cur.na) continue;
      const k = cur.ai++;
      cur.x[k] = +p[2]; cur.y[k] = +p[3]; cur.z[k] = +p[4]; cur.el[k] = codeOf(p[5]);
      cur.cat[k] = catOf(p[7] || ''); cur.sid[k] = +p[6] || 0; cur.cof[k] = ETC_RES[p[7]] || 0;   // 0 = not a cofactor, else type code 1-9
      if(p[7] === 'TYR') cur.tyr[k] = 1;
      cur.lip[k] = LIPID_RES[p[7]] || 0;
    } else if(section === 'BOND'){
      const p = ln.trim().split(/\s+/);
      if(p.length < 4 || cur.bi >= cur.nb) continue;
      const k = cur.bi++;
      cur.b1[k] = (+p[1]) - 1; cur.b2[k] = (+p[2]) - 1;
      cur.bo[k] = p[3]==='2' ? 2 : p[3]==='3' ? 3 : 1;   // double / triple / (single, aromatic, amide → 1)
    }
  }
  return mols.filter(m => m.na > 0);
}

/* Tyr Z (D1-Tyr161) — the redox-active tyrosine that ferries electrons from the OEC to P680⁺.
   The mol2 carries no chain id or PDB numbering, so name-matching can't find it; instead we use the
   geometry that DEFINES it: it is the one tyrosine hydrogen-bonded to the Mn₄CaO₅ cluster (~5 Å).
   Tyr D, its pseudo-symmetric twin on D2, sits ~30 Å from any Mn and is correctly left unmarked.
   A dimer simply yields one Tyr Z per monomer. Marks every atom of each matching TYR residue. */
function markTyrZ(m){
  if(!m.tyr || !m.cof) return;
  const oi=[];                                                 // OEC atom indices (Mn/Ca/O of the cluster)
  for(let k=0;k<m.na;k++) if(m.cof[k]===1) oi.push(k);
  if(!oi.length) return;                                       // no OEC in this model → no Tyr Z
  // Split the OEC atoms into clusters (one per PSII monomer) by single-linkage within 6 Å.
  const cid = new Array(oi.length).fill(-1); let nc = 0;
  for(let a=0;a<oi.length;a++){
    if(cid[a] >= 0) continue;
    cid[a] = nc; const stack=[a];
    while(stack.length){ const p=stack.pop(), pk=oi[p];
      for(let b=0;b<oi.length;b++){ if(cid[b]>=0) continue; const bk=oi[b];
        const dx=m.x[pk]-m.x[bk], dy=m.y[pk]-m.y[bk], dz=m.z[pk]-m.z[bk];
        if(dx*dx+dy*dy+dz*dz < 36){ cid[b]=nc; stack.push(b); } } }
    nc++;
  }
  // Per cluster, the SINGLE closest tyrosine is Tyr Z (its OH hydrogen-bonds the cluster, ~5 Å).
  // Tyr D, the pseudo-symmetric twin on D2, is ~30 Å away and never wins.
  const best = new Array(nc).fill(-1), bestD = new Array(nc).fill(Infinity);
  const resMin = new Map();                                    // residue id → [minDist², cluster]
  for(let k=0;k<m.na;k++){
    if(!m.tyr[k]) continue;
    for(let a=0;a<oi.length;a++){ const ok=oi[a];
      const dx=m.x[k]-m.x[ok], dy=m.y[k]-m.y[ok], dz=m.z[k]-m.z[ok], d2=dx*dx+dy*dy+dz*dz;
      const cur = resMin.get(m.sid[k]);
      if(!cur || d2 < cur[0]) resMin.set(m.sid[k], [d2, cid[a]]);
    }
  }
  // Only a REAL Mn₄CaO₅ cluster counts — lone Mn/Ca ions elsewhere in the structure form their own
  // 1-2 atom "clusters" and would each drag in a spurious nearby tyrosine.
  const csize = new Array(nc).fill(0); for(const c of cid) csize[c]++;
  for(const [sid, v] of resMin){ const [d2, c] = v;
    if(csize[c] >= 4 && d2 < 100 && d2 < bestD[c]){ bestD[c] = d2; best[c] = sid; } }   // within 10 Å, nearest wins
  const hit = new Set(best.filter(s => s >= 0));
  if(!hit.size) return;
  for(let k=0;k<m.na;k++) if(m.tyr[k] && hit.has(m.sid[k])) m.cof[k] = ETC_TYRZ;
}

/* Pull one complete chlorophyll (CLA/CHL/PHO residue) out of the model as its own molecule. */
function extractChlorophyll(m){
  if(!m.sid) return null;
  const groups = new Map();                      // group chlorophyll atoms by residue id
  for(let k=0;k<m.na;k++) if(m.cat[k]===1){
    const g = groups.get(m.sid[k]); if(g) g.push(k); else groups.set(m.sid[k], [k]);
  }
  let best = null;
  for(const g of groups.values()) if(!best || g.length > best.length) best = g;   // the largest = a full chlorophyll
  if(!best || best.length < 20) return null;
  const na = best.length, map = new Map();
  best.forEach((gi,li) => map.set(gi, li));
  const nm = { name:'Chlorophyll', na, ai:na, nb:0,
    x:new Float32Array(na), y:new Float32Array(na), z:new Float32Array(na),
    el:new Uint16Array(na), cat:new Uint8Array(na), sid:new Int32Array(na) };
  for(let li=0;li<na;li++){ const gi=best[li];
    nm.x[li]=m.x[gi]; nm.y[li]=m.y[gi]; nm.z[li]=m.z[gi]; nm.el[li]=m.el[gi]; nm.cat[li]=m.cat[gi]; }
  const b1=[], b2=[], bo=[];                      // keep only bonds internal to this residue (remapped)
  for(let k=0;k<m.nb;k++){ const a=m.b1[k], b=m.b2[k];
    if(map.has(a) && map.has(b)){ b1.push(map.get(a)); b2.push(map.get(b)); bo.push(m.bo[k]); } }
  nm.nb=b1.length; nm.b1=Int32Array.from(b1); nm.b2=Int32Array.from(b2); nm.bo=Uint8Array.from(bo);
  return nm;
}

/* Pull one lipid molecule (category 4) out of the model → atoms AND its internal bonds
   (the bonds are needed to build the same hybridised σ/π/lone-pair lobes as the protein). */
function extractLipid(m, code){
  if(!m.sid) return null;
  const groups = new Map();
  // `code` (a LIPID_RES value) picks ONE named lipid species. Without it, the largest lipid of any
  // kind is taken — kept as the fallback for models whose lipids carry names we do not recognise.
  for(let k=0;k<m.na;k++){ const want = code ? (m.lip && m.lip[k]===code) : (m.cat[k]===4);
    if(want){ const g=groups.get(m.sid[k]); if(g) g.push(k); else groups.set(m.sid[k],[k]); } }
  let best=null;
  for(const g of groups.values()) if(!best || g.length>best.length) best=g;   // largest = a complete lipid
  if(!best || best.length < 30) return null;
  const na=best.length, map=new Map();
  best.forEach((gi,li) => map.set(gi, li));
  const out={ na, nb:0, x:new Float32Array(na), y:new Float32Array(na), z:new Float32Array(na), el:new Uint16Array(na) };
  for(let li=0;li<na;li++){ const gi=best[li]; out.x[li]=m.x[gi]; out.y[li]=m.y[gi]; out.z[li]=m.z[gi]; out.el[li]=m.el[gi]; }
  const b1=[], b2=[], bo=[];                      // keep only bonds internal to this residue (remapped)
  for(let k=0;k<m.nb;k++){ const a=m.b1[k], b=m.b2[k];
    if(map.has(a) && map.has(b)){ b1.push(map.get(a)); b2.push(map.get(b)); bo.push(m.bo[k]); } }
  out.nb=b1.length; out.b1=Int32Array.from(b1); out.b2=Int32Array.from(b2); out.bo=Uint8Array.from(bo);
  return out;
}

attribute vec4 world2;
attribute vec4 world3;

attribute vec4 tint;     // cell mode: the organelle's hue and how much of it (0 = the lipid's own colour)

varying vec3 vCenterV;
varying vec3 vColor;
varying vec3 vWCen;      // instance world centre → identify the selected atom's nucleons

#endif
#endif

// (start + v*t) into a TRIANGLE WAVE gives exactly that, analytically, with no state - so 20000 molecules

attribute vec3 wOrig;
attribute vec3 wVel;
uniform vec3 boxLo;
uniform vec3 boxHi;
uniform float memY;
uniform float memHalf;
#ifdef CELLCLIP

uniform vec3 cellCam;
uniform vec3 cellCen;
uniform float cellR;
uniform float cellFacetY;
uniform float cellMemT;
uniform float cellClipAll;
uniform vec4 orgA[32];
uniform vec4 orgB[32];
uniform float nOrg;
uniform vec4 thyA;       // the thylakoid cap: centre, radius - no molecule inside its bilayer (inside the host envelope only)
uniform vec4 thyB;       // the host's inner envelope: centre, base radius
uniform vec3 thyInvS;

#endif
/* Molecule-vs-molecule collisions ride ON TOP of that analytic path as a DISPLACEMENT, looked up per
   molecule from a texture. The analytic wave stays the reference trajectory and costs nothing, while
   the CPU simulates only the molecules near the camera and writes their deviation here. Everything
   else reads zero and is exactly as before.
   Doing it this way keeps the property that made 65000 molecules affordable in the first place: the
   far ones need no state, no integration and no upload. Only what you can actually see is simulated. */
attribute float molId;
uniform sampler2D molTex;
uniform float molTexDim;
vec3 molDisp(){
  float x = mod(molId, molTexDim), y = floor(molId / molTexDim);
  return texture2D(molTex, vec2((x + 0.5)/molTexDim, (y + 0.5)/molTexDim)).xyz;

float hsh(uint x){ x ^= x >> 16u; x *= 0x7feb352du; x ^= x >> 15u; x *= 0x846ca68bu; x ^= x >> 16u; return float(x & 0xffffffu) / 16777216.0; }   // lowbias32, bit-identical to spinS in JS
float bnc(float x, float lo, float hi){
  float s = hi - lo;
  float t = mod(x - lo, 2.0*s);
  return lo + (t < s ? t : 2.0*s - t);
}

// Protein collision shells. Each is a star-shaped radius field sampled on SH_LAT x SH_LON bearings and
// packed into shellTex, one SH_LAT-row block per shell. A molecule whose centre lands inside a shell is
// pushed straight back out to the surface along the bearing it came in on, so it slides around the
// protein instead of drifting through it. Purely a function of position - no state, nothing uploaded.
uniform sampler2D shellTex;
uniform vec3 shellCen[NSHELL];
uniform mat3 shellRot[NSHELL];
uniform float shellR2[NSHELL];
uniform float shellSkip;   // one shell this species is not pushed out of (the protons and the ATP synthase channel) - -1 for none
vec3 repelShells(vec3 p){

    if(r2 >= shellR2[i] || r2 < 1e-8) continue;

    if(r < Rs) p += d * (Rs/r - 1.0);

#endif
#endif
#ifdef MEMFADE
// Membrane-only fluid sway. The phase is taken from the IN-PLANE position (x,z) alone, so every atom
// of one upright lipid shares it and the lipid stays rigid, while lipids a tile apart are out of
// phase and visibly slide past one another — a fluid bilayer, not one sheet breathing as a block.
uniform float memDrift;   // lateral crowd-shuffle amplitude (scene units) - 0 restores the rigid sheet
/* Fluid mosaic. The first term is the old sheet-wide swell, which moved every lipid together so the
   membrane read as one rigid sheet rippling. The second gives each lipid its own slow in-plane loop,
   phased off its anchor, so neighbours slide PAST one another and the crowd shears instead of swaying
   as one. The loop is closed, so a lipid wanders around its own patch and never drifts out of the cell
   block that culls it. The sheet-wide phase is folded in, so the shuffle travels as a wave rather than
   reading as uncorrelated jitter. */
vec3 memSway(vec3 b, float sid){ float ph = b.x*0.28 + b.z*0.24;

  float h = fract(sid*0.0731 + 0.5);   // NOT a sin hash: sid is a tile z up to +-600, and float32 sin of
                                        // 76000 radians is unreproducible on the CPU, which has to place
                                        // these lipids exactly to pick them. Adjacent tiles still land
                                        // ~0.43 apart in h, so neighbours stay out of step.
  float k = 6.2831853 * h, w = 0.22 + 0.30*h;
  sw.x += memDrift * sin(uT*w + k + ph*0.5);
  sw.z += memDrift * cos(uT*w*0.83 + k*1.7 + ph*0.5);
  return sw; }

void main(void){
  mat4 W = mat4(world0, world1, world2, world3);
#ifdef LIPWRAP
  W[3].xyz += tileOff;   // membrane wrap - this cell is repeated to the copy nearest the camera, and doing
                         // it HERE means every downstream use (centre, shake, sway, reveal cone) follows
#endif
  vec3 base = W[3].xyz;
#ifdef WATERBOX
  // Repel the molecule CENTRE, then add this atom's rigid offset - so the whole molecule is displaced as
  // one body and is not torn apart at a shell surface.
  /* The membrane is a wall: a molecule keeps to the half of the box it started in, folded at the lipid
     layer's face (memY plus or minus memHalf) instead of at the box wall. memHalf 0 = no membrane. */
  float yLo = boxLo.y, yHi = boxHi.y;
  if(memHalf > 0.0){ if(wOrig.y >= memY) yLo = max(yLo, memY + memHalf); else yHi = min(yHi, memY - memHalf); }
  float yO = clamp(wOrig.y, yLo, yHi);

    wCen += k * cellWrap;
    bool copy = dot(k, k) > 0.5;
    if(copy || cellClipAll > 0.5) cellDrop = !cytosol(wCen);
    if(!cellDrop && inThyBand(wCen)) cellDrop = true;
    if(copy && cellFade > 0.0) cellShrink = 1.0 - smoothstep(cellFade - 70.0, cellFade, distance(wCen, cellCam)); }
#endif

     molecule's ANALYTIC bounced coordinates (before the displacement and the shells, so the CPU can
     reproduce it exactly), so it is continuous in time, its rate is a per-molecule random combination
     of the velocity components, and every wall bounce flips one component - the spin changes speed
     and direction at each collision for free, with no state. The hash is an integer one (lowbias32)
     and the same code runs in JS (spinS), so the orbitals, outlines and picking the CPU places on
     these molecules land exactly where the GPU draws the atoms. One-atom species (the protons) have a
     zero offset and are unaffected. */
  { uint sid = uint(molId + 0.5);
    float h1 = hsh(sid * 7u + 1u), h2 = hsh(sid * 7u + 2u), h3 = hsh(sid * 7u + 3u), h4 = hsh(sid * 7u + 4u), h5 = hsh(sid * 7u + 5u), h6 = hsh(sid * 7u + 6u);
    vec3 ax = normalize(vec3(h1, h2, h3) - 0.5 + vec3(0.001, 0.0, 0.0));
    vec3 sk = (vec3(h4, h5, h6) - 0.5) * 0.16;   // rad per world unit, per axis - with speeds of 30-70 units per second that is a few radians per second
    float th = dot(sk, wCen);

#ifdef NSHELL

#endif
#endif

#endif

#endif
#ifdef LIPTPL

#endif

  // BOTH the shaken point and the centre — exactly the order the orb shader uses. Doing modelXform first
  // (as before) made the nuclei shake with the flattened Z while the orbitals shook with the original Z,
  // so they waved out of phase and drifted apart. Now the nuclei ride WITH their orbitals.
  // The thermal shake stays ON outside the crisp zone too - the far tier has to drift and sway exactly
  // like the near tier, or the boundary shows up as a line between moving and frozen geometry. Only the
  // BOIL hash (three fract/sin per vertex) is dropped out there.

     atom's centre, but a nucleon sits up to 0.05 off it, and the boil hash of that point is a different
     random number - so every nucleon of a nucleus jittered on its own and the cluster sat off the
     centre of its shell and its orbitals, worst while everything wiggled. A nucleon instance now
     carries its atom's centre in the three unused w slots of its matrix (world0.w, world1.w, world2.w,
     zero on every other instance), and hashes from that. */

  { vec3 pc = vec3(W[0].w, W[1].w, W[2].w);

#endif
    } }
#ifdef WATERBOX

#endif
  vHb = hb;
#if defined(WATERBOX) || defined(NOSWAY)
  vec3 wc = base;   // a moving molecule gets no thermal sway - the sway phase is position-based and turns into jitter at speed
#else
  vec3 wc = base + (shake(hb) - hb);

    float hx = fract(sin(dot(hb, vec3(12.9898, 78.233, 37.719)) + bt) * 43758.5453) - 0.5;
    float hy = fract(sin(dot(hb, vec3(93.989, 47.271, 23.157)) + bt*2.3) * 19349.663) - 0.5;
    float hz = fract(sin(dot(hb, vec3(39.346, 11.135, 83.155)) + bt*1.7) * 24634.633) - 0.5;
#ifndef NUCLEON
    wc += boil * 0.2 * vec3(hx, hy, hz);   // small per-atom drift - the SHAPE warp itself is done in the fragment, this is just a little life. NOT the nucleons: 0.02 is invisible on a shell but a nucleon width on a nucleus, and made every nucleus hop
#endif
  }
#endif
#ifdef MEMFADE
  /* The sway phase is seeded from the LIPID's origin, never the atom's own position. Seeding it from
     base (which already carries the atom's offset inside the lipid) gave every atom of one lipid its own
     phase, so the shells drifted up to a lattice spacing away from the lipid's orbital lobes - which sway
     as one from the origin (as do the mask, the outlines and the CPU mirror). That was the long-standing
     'orbitals without a vdW shell' - the shell was there, a few units to the side. */
#ifdef LIPTILE
  wc += tileRot * memSway(tileOff, tileOff.z);   // pooled nucleons: the tile origin IS the lipid origin and id (the sway in the lipid's own plane)
#elif defined(LIPTPL)
  wc += mat3(W) * memSway(W[3].xyz, memAnc);     // the instance IS the lipid: its translation is the origin the orbital templates sway from
#else
  wc += memSway(base, memAnc);         // membrane fluid sway - kept in BOTH tiers so the sheet moves as one
#endif

#elif defined(LIPWRAP)
  vMemAnc = memAnc + tileOff.z;   // wrapped copy: its anchor moves with it
#else
  vMemAnc = memAnc;      // per-instance lipid anchor
#endif
#endif
#ifdef MODELMOVE
  wc   = (modelXform[int(modelId + 0.5)] * vec4(wc,   1.0)).xyz;
  base = (modelXform[int(modelId + 0.5)] * vec4(base, 1.0)).xyz;
#endif

#ifdef MACROMOVE
  wc = (macroXform * vec4(wc - macroCenter, 1.0)).xyz;
#endif
  vec4 cV = view * vec4(wc, 1.0);

  // giving each sphere's surface a WORLD-space parameterisation the boil warp can lock onto (no swim).
  vWB0 = vec3(view[0][0], view[1][0], view[2][0]);
  vWB1 = vec3(view[0][1], view[1][1], view[2][1]);
  vWB2 = vec3(view[0][2], view[1][2], view[2][2]);
  float qexp = boil > 0.001 ? 1.2 : 1.0;   // enlarge the billboard while boiling so a bulging silhouette has headroom
  vUV = position.xy * qexp;
  vColor = instanceColor.rgb;

  vColor = mix(vColor, tint.rgb * (0.5 + 0.6 * dot(vColor, vec3(0.3, 0.59, 0.11))), tint.a) * shade;   // the organelle's hue, keeping the lipid's own light and dark, and the depth cue
#endif
  vFlag = instanceColor.a;
  vMid = -1.0;
#ifdef ETCHL
  vGid = groupId;
#endif
#ifdef MODELMOVE
#ifndef NUCLEON
  // colour-by-model tints atoms - but NEVER the nuclei (protons red / neutrons grey always), and never
  // an instance that carries its own identity colour (alpha 1), which is how each distinct molecule
  // keeps its own hue instead of being flattened into its host protein's pastel.
  if(colorMode > 0.5 && instanceColor.a < 0.5) vColor = modelCol[int(modelId + 0.5)];
#endif
  vMid = modelId;
#endif
  float rad = radius;
#ifdef IMPRAD
  rad *= instR;
#endif
#ifdef CELLCLIP
  rad *= cellShrink;
#endif
  vRad = rad;

  // off-axis FOV of a VR headset a view-axis billboard visibly swings as you turn — reading as the
  // balls "following" your head — whereas facing the eye keeps them put. Identical on-axis (desktop).
  vec3 vToEye = normalize(-cV.xyz);

  vec3 vr = normalize(cross(upv, vToEye));
  vec3 vu = cross(vToEye, vr);
  vec3 cornerV = cV.xyz + (vr * position.x + vu * position.y) * rad * qexp;
#ifdef CELLCLIP
  if(cellDrop){ gl_Position = vec4(2.0, 2.0, 2.0, 1.0); return; }   // outside the cytosol: off the clip volume
#endif
  gl_Position = projection * vec4(cornerV, 1.0);
}`;

#endif
#ifdef COFHIDE
uniform sampler2D cofDepth;   // nearest cofactor's view-space depth per screen pixel (1e9 = none)
uniform vec2 cofTexel;        // 1 / render size → gl_FragCoord to [0,1]
uniform float cofHideOn;      // 1 = cofactor see-through active
uniform float cofAlpha;       // opacity of a revealed atom's vdW FILL (dev slider: 0 = invisible → 1 = solid)
uniform float cofOutAlpha;    // opacity of a revealed atom's OUTLINE (dev slider)
uniform float cofOutCol;      // grey level of a revealed atom's outline (0 = black → 1 = white)
#endif
#ifdef MEMFADE
uniform vec3 memCut;       // [cutZ, cutSign, strength] → membrane lipids in front of the plane fade away
varying float vMemAnc;     // per-lipid anchor Z → the cut hides WHOLE lipids, never slices one in half
#endif
#ifdef ETCHL
varying float vGid;        // this cofactor atom's group index
uniform float hlGroup;     // the group to highlight (hover / flash), -1 = none
uniform float hlBright;    // its brightness multiplier (1.0 = normal, 1.25 = hover, pulses on select)
#endif
uniform float selModel;    // index of the SELECTED complex (−1 = none) → its atoms get a sage rim
uniform vec3 selCol;       // that rim's colour (sage)
uniform float focusAmt;    // O: 0 = off, 1 = full grayscale of everything OUTSIDE the selection
uniform float focusMode;   // 0 = grayscale all, 1 = keep colour near focusCenterV, 2 = keep colour where focusSet[model]=1
uniform vec3 focusCenterV; // point-selection centre (view space)
uniform float focusR;      // point-selection radius
uniform float focusSet[48];// per-model keep-colour flags (mode 2)
uniform float focusGroup;  // cofactor group to keep coloured (mode 3, ETCHL overlay only)
uniform float focusDark;   // darken the grayscale (non-selection) environment: 0 = plain grey, 1 = to black
#ifdef PLIGHT
/* Free protons as red LIGHT SOURCES. The nearest PL_N of them are uploaded each frame and every lit
   atom sums a soft inverse-square red term from them, evaluated at the atom centre. This is what the
   lantern electron cannot do - that one is a screen-space spotlight around a single point - and it is
   the part that makes the glow land ON neighbouring atoms rather than only hang in the air around
   the proton. */
#define PL_N 16
uniform vec3 pLight[PL_N];
uniform float pLightN;
uniform float pLightR;     // falloff radius - the distance at which the light has dropped to a fifth
/* Soft key light from above. World-space, so it stays put as the camera moves - which is what makes it
   read as a light in the scene rather than a screen effect. Soft: the floor is 0.72, so nothing goes
   into shadow, it just rounds. A material that never sets keyDir gets a zero vector and stays flat. */
uniform vec3 keyDir;
float keyLight(vec3 nW){ if(dot(keyDir, keyDir) < 0.5) return 1.0;
  return 0.60 + 0.40 * pow(max(dot(normalize(nW), keyDir), 0.0), 1.2); }   // a firmer key than the old 0.72 floor: the shadow side drops to 60 percent
vec3 protonLight(vec3 p){ vec3 acc = vec3(0.0);
  /* A compact falloff, exactly zero at pLightR. The old 1/(1+4d*d) never reached zero, and since the
     lights are the protons nearest the CAMERA, every atom you approached picked up their red - the
     'atoms turn red as I get close' that had nothing to do with what was behind them. */
  for(int i=0; i<PL_N; i++){ if(float(i) >= pLightN) break;
    float w = max(0.0, 1.0 - distance(p, pLight[i]) / pLightR);
    acc += vec3(1.0, 0.24, 0.12) * (w*w); }
  return acc * 0.9; }
#endif
varying vec2 vUV;
varying vec3 vCenterV;
varying vec3 vColor;
varying vec3 vWCen;
varying vec3 vHb;        // boil-hash point (see the vertex shader) - the lump phase keys on it, so a moving molecule's wobble does not slide
varying float vFlag;
varying float vRad;      // per-instance radius (vdW LOD)
varying float vMid;      // this instance's model index
varying vec3 vWB0;       // view→world basis rows (see vertex) → world-space surface normal for the boil warp
varying vec3 vWB1;
varying vec3 vWB2;
uniform float boil;      // line-boil amount (0 = off) → warps the silhouette, object-locked
void main(void){
#ifdef PGLOW
  /* Proton corona: a soft additive red disc, bigger than the vdW shell, drawn with the same stateless
     positioning as the proton itself so it can never drift off it. Alpha only feeds the ADD blend. */
  { float r2g = dot(vUV, vUV);
    if(r2g > 1.0) discard;
    float g = pow(1.0 - r2g, 2.4);
    gl_FragDepthEXT = gl_FragCoord.z;
    gl_FragColor = vec4(vec3(1.0, 0.26, 0.13) * g * 0.8, g * 0.8);
    return; }
#endif
  float r2 = dot(vUV, vUV);
#ifdef CHEAP
  // FAR LOD - a flat shaded disc, written OPAQUE. Two separate wins. It skips the boil warp, the
  // per-fragment sphere raytrace, the gl_FragDepthEXT write, the ink rim, the fresnel shimmer and all the
  // focus/cofactor work - none of which is visible on an atom a couple of pixels wide. And because it is
  // opaque with a plain depth write (no blending, no fragment depth), the GPU can early-Z reject it, so a
  // far atom hidden behind nearer geometry is never shaded at all.
  if(r2 > 1.0) discard;
#ifdef MEMFADE
  if(memCut.z * step(0.0,(vMemAnc - memCut.x)*memCut.y) > 0.5) discard;   // honour the membrane cross-cut
#endif
  /* Shade with the REAL sphere normal, the same half-lambert the crisp path uses, the same rim, and the
     same depth darkening. A cheap linear ramp instead of this was tried and the boundary was glaring —
     a hard diagonal seam between bright near atoms and dark far ones, because the crisp path applies
     DEPTHSHADE (up to 0.55x) and the flat path did not, so the two tiers were not even the same
     brightness. One sqrt and one dot per fragment is what buys a seamless join.
     The real far-tier win was never the shading: it is that this path is OPAQUE with a plain depth
     write, no gl_FragDepthEXT and no alpha blending, so the GPU can early-Z reject a far atom hidden
     behind nearer geometry and never shade it at all. That is kept, and it does not affect appearance. */
  float zcF = sqrt(max(0.0, 1.0 - r2));
  vec3 nF = vec3(vUV, -zcF);
  vec3 colF = vColor;
#ifdef PLIGHT
  colF *= keyLight(vec3(dot(vWB0, nF), dot(vWB1, nF), dot(vWB2, nF)));   // soft key from above, in world space
#endif
  colF *= 1.0 - 0.14 * smoothstep(0.55, 1.0, r2);
  /* The SAME ink rim as the crisp path, scaled by the atom's size on screen the same way (see rimK
     there). When the crisp rim was made to thin out on small discs this path kept the fat fixed band,
     which darkens a quarter of a 3 px disc - so a cell brightened the moment it swapped to the crisp
     material, and the swap front read as a hard light-dark edge sweeping over every complex. */
  float pxRF = 2.0 / max(fwidth(vUV.x) + fwidth(vUV.y), 1e-5);
  float rimKF = smoothstep(2.0, 30.0, pxRF);
  float rimStartF = 1.0 - 0.14 * mix(0.35, 1.0, rimKF);
  float rimF = smoothstep(rimStartF, 1.0, r2) * mix(0.3, 1.0, rimKF);
  if(protonOutline < 0.5){   // and the same faint cool sheen on the grazing edge, so the two tiers carry the same light
    float fresF = pow(1.0 - zcF, 2.3);
    float shimF = 0.5 + 0.5*sin(uT*2.3 + vWCen.x*0.14 + vWCen.y*0.10 + vWCen.z*0.12);
    colF += vec3(0.10, 0.24, 0.55) * fresF * (0.34 + 0.5*shimF);
  }
  colF = mix(colF, vColor * 0.40, rimF);
#ifdef DEPTHSHADE
  float dtF = clamp((length(vCenterV) - focalD - startOff) / max(spread, 1.0), 0.0, 1.0);   // camera distance past the pivot
  colF *= mix(1.0, depthLo, dtF * depthK);
#endif
#ifdef MODELMOVE
  if(selModel >= 0.0 && abs(vMid - selModel) < 0.5) colF = mix(colF, selCol, 0.35);   // keep selection readable
#endif
  float fogF = clamp((fogEnd - vCenterV.z) / (fogEnd - fogStart), 0.0, 1.0);
#ifdef PLIGHT
  colF += protonLight(vWCen);
#endif
  gl_FragColor = vec4(mix(fogColor, colF, fogF), 1.0);
  return;
#endif
  if(boil > 0.001){                          // WARP the silhouette (not just shift): push the disc radius in/out
    float zc0 = sqrt(max(0.0, 1.0 - min(r2, 1.0)));
    vec3 nW = vWB0 * vUV.x + vWB1 * vUV.y + vWB2 * (-zc0);   // world-space surface normal → lumps ride WITH the sphere
    float bt = floor(uTb * (7.0 + boilHzAdj));              // stepped clock → the wobble redraws ~7x/sec (hand-drawn boil, not smooth)
    float lump = sin(nW.x * 5.5 + vHb.x * 0.6 + bt)
               + sin(nW.y * 5.5 + vHb.y * 0.6 + bt * 1.3)
               + sin(nW.z * 5.5 + vHb.z * 0.6 + bt * 0.7);   // ±3 world-locked lumpy field, per-atom phase from vWCen
    r2 = max(0.0, r2 + boil * 0.05 * lump);  // ±0.15 radius warp at full boil → wavy, dented/bulged outline
  }
  float aa = min(fwidth(r2), 0.16);         // screen-space edge width (capped) → anti-alias far, tiny spheres without dissolving them
  if(r2 > 1.0 + aa) discard;
  float zc = sqrt(max(0.0, 1.0 - min(r2, 1.0)));
  vec3 n = vec3(vUV, -zc);                 // sphere normal toward camera
  vec3 posV = vCenterV + n * vRad;
  float dist = length(vCenterV);           // atom-centre distance from the camera
  // TRUE ALPHA — every fade below is a real coverage value written to gl_FragColor.a and blended.
  // (No screen-door dither anywhere.) Depth-write stays on, so fully opaque fragments still occlude.
  float alpha = 1.0;
#ifdef MEMFADE
  alpha *= 1.0 - memCut.z * step(0.0,(vMemAnc - memCut.x)*memCut.y);   // whole-lipid cut (per-molecule anchor) — only memCut.z (the fade) is ever partial
#endif
  float edge = smoothstep(bubbleR - 8.0, bubbleR, dist);      // 0 inside the reveal radius, 1 beyond it
  float perp = (vCenterV.z > 0.0) ? length(vCenterV.xy)/vCenterV.z : 1e9;   // tan(angle) from the view axis → forward cone (matches the orbital shaders)
  float inCone = (coneCos < -0.5) ? 1.0 : 1.0 - smoothstep(coneCos*0.86, coneCos, perp);   // soft-edged cone rim
  float reveal = (1.0 - edge) * inCone;                       // 1 = orbitals/nuclei show here, 0 = vdW shell
  float rimGlass = mix(shellMin, 0.72, smoothstep(0.34, 1.0, r2));   // revealed shell = a glass bubble, near-clear centre and a visible rim, so the orbitals inside stand out
  // Distance gradient - a revealed shell is full glass right up close and fades to (revealFade) opaque at the reveal
  // edge, so distant atoms stay mostly solid while only the ones you are on top of go clear.
  float grad = smoothstep(0.0, bubbleR, dist);               // 0 close → 1 at the reveal edge
  float glassA = mix(rimGlass, max(rimGlass, revealFade), grad);
  alpha *= (isShell < 0.5) ? reveal : mix(1.0, glassA, reveal);   // core fades IN where revealed, shell becomes the distance-graded glass bubble
  alpha *= 1.0 - smoothstep(1.0 - aa, 1.0 + aa, r2);          // anti-aliased silhouette (soft coverage at the disc edge)
#ifdef COFHIDE
  // Line of sight to the ETC cofactors: an atom IN FRONT of a cofactor goes see-through so the cofactor
  // behind shows through. cofClear flags it here - the fill/outline opacity + outline colour apply below.
  float cofClear = 0.0;
  if(cofHideOn > 0.5){
    vec4 cClip = projection * vec4(vCenterV, 1.0);
    vec2 cUV = (cClip.xy / cClip.w) * 0.5 + 0.5;
    float rd = texture2D(cofDepth, cUV).r;                          // deepest per-atom CONE reveal-depth at this pixel (0 = no cofactor cone here)
    if(rd > 0.5 && vCenterV.z < rd - 0.6) cofClear = 1.0;           // atom is in front of the cone → mark it see-through (fill/outline opacity + colour applied at output)
  }
#endif
  if(alpha < 0.004) discard;                                  // fully transparent → skip (also keeps depth clean)
  if(depthBias > 0.0 && distance(vWCen, selCenter) < 0.35) discard;   // selected atom → its spinning highlight nucleus draws instead
  // Bias the nucleus toward the camera so it beats its OWN orbitals (but not atoms clearly in front).
  // CLAMPED so it never crosses the near plane - a flat shove would push an atom you are zoomed right
  // up against straight through it. It used to clamp to HALF the view depth instead, which meant an
  // atom nearer than 4 units got less than the full bias and at 2 units only half of it - less than its
  // own lobes reach - so nuclei vanished on exactly the atoms you were closest to, and which those were
  // changed as you turned. The near plane is read off the projection matrix (Babylon LH perspective).
  if(depthBias > 0.0){ float nearZ = -projection[3][2] / projection[2][2];
    posV.z = max(posV.z - depthBias, nearZ + 0.02); }
  vec4 clip = projection * vec4(posV, 1.0);
  gl_FragDepthEXT = clip.z / clip.w * 0.5 + 0.5;
  vec3 col = vColor;
#ifdef PLIGHT
  col *= keyLight(vec3(dot(vWB0, n), dot(vWB1, n), dot(vWB2, n)));   // soft key from above, in world space
#endif
  col *= 1.0 - 0.14 * smoothstep(0.55, 1.0, r2);              // subtle self-shade
  if(focusAmt > 0.001){   // O: grayscale this fragment unless it is part of the selection → the coloured region is the EXACT silhouette
    bool fsel;
    if(focusMode > 2.5){   // mode 3 = a cofactor GROUP: only the overlay atoms tagged with that group keep colour
#ifdef ETCHL
      fsel = abs(vGid - focusGroup) < 0.5;
#else
      fsel = false;        // the protein underneath greys out
#endif
    } else if(focusMode > 1.5){ fsel = (vMid >= 0.0 && focusSet[int(vMid + 0.5)] > 0.5); }   // mode 2 = model set
    else if(focusMode > 0.5){ fsel = distance(vCenterV, focusCenterV) < focusR; }             // mode 1 = point
    else fsel = false;                                                                        // mode 0 = grey all
    if(!fsel){ float fg = dot(col, vec3(0.299, 0.587, 0.114)); col = mix(col, vec3(fg) * (1.0 - focusDark), focusAmt); } }
#ifdef ETCHL
  bool hl = abs(vGid - hlGroup) < 0.5;                        // hovered / flashing cofactor group
  if(hl) col *= hlBright;                                     // → brighter FILL (the dark outline is applied AFTER, so it stays dark)
#endif
  // Ink outline band. Normally starts at 0.86 (width 0.14). For atoms REVEALING orbitals (glass shells)
  // start it at 0.965 (width 0.035 ≈ 4× thinner) so the thin rim doesn't obscure the orbitals inside.
  float rimStart = mix(0.86, 0.965, (isShell > 0.5) ? reveal : 0.0);
#ifdef ETCHL
  if(hl) rimStart -= (hlBright - 1.0) * 0.5;                  // → thicker vdW outline, scaled by the highlight brightness → steady on hover, PULSES with the select flash
#endif
#ifdef ETCTHIN
  rimStart = max(rimStart, 0.94);                            // cofactor overlay - a thin outline that matches the protein silhouette (not the fat 0.14 per-atom rim)
#endif
  /* The ink scales with the atom's size ON SCREEN. The band is a fraction of the radius, so on a
     3 px disc the outermost ring of pixels - half the disc - came out black. pxR is the disc radius in
     pixels (vUV runs -1..1 across it), and below ~30 px both the band and the ink strength ease down
     to a faint hairline - thin far away, the full band up close. */
  float pxR = 2.0 / max(fwidth(vUV.x) + fwidth(vUV.y), 1e-5);
  float rimK = smoothstep(2.0, 30.0, pxR);
  rimStart = 1.0 - (1.0 - rimStart) * mix(0.35, 1.0, rimK);
  float rim = smoothstep(rimStart - min(aa, 0.008), 1.0, r2) * mix(0.3, 1.0, rimK);   // thin ink band like the orbital lobes, tiny aa only so revealed shells do not get a fat outline
  // Subtle electric-blue shimmer: a faint cool sheen that rides the sphere's grazing edge and drifts in time.
  if(protonOutline < 0.5){
    float fres = pow(1.0 - zc, 2.3);
    float shim = 0.5 + 0.5*sin(uT*2.3 + vWCen.x*0.14 + vWCen.y*0.10 + vWCen.z*0.12);
    col += vec3(0.10, 0.24, 0.55) * fres * (0.34 + 0.5*shim);
  }
  if(protonOutline > 0.5 && vFlag > 0.5){
    float pf = pow(1.0 - zc, 1.6);                           // broad, soft Fresnel (zc = sqrt(1-r2)) → hazy edge
    col = mix(col, vec3(1.0, 0.18, 0.18), pf) + vec3(0.40, 0.0, 0.0) * pf;   // hazy red glow on protons
  } else {
#ifdef ETCDARK
    col = mix(col, vec3(0.03), rim);                       // cofactors → a BLACK outline that traces the molecule shape (each atom outlined, interior rims occluded by the atoms in front → the eye reads the outer contour)
#else
 #ifdef COFHIDE
    col = mix(col, (cofClear > 0.5) ? vec3(cofOutCol) : vColor * 0.40, rim);   // a see-through atom's outline uses the dev colour, otherwise the atom's own 40% shade
 #else
    col = mix(col, vColor * 0.40, rim);                    // rim → a FIXED 40% shade of the atom's own UNLIT colour → same darkness whichever way the sphere faces the light (was col *= mix(1.0,0.40,rim), whose 40%-of-LIT-colour went near-black on shadowed edges → the inconsistent thick-black outlines)
 #endif
#endif
  }
  // Selected complex → repaint each of its atoms' rims sage. Every atom is outlined, so the shape
  // the eye picks up is the OUTER contour of the whole protein (interior rims are hidden behind the
  // atoms in front of them) — an outline, not the filled silhouette a highlight layer would give.
  if(selModel >= 0.0 && abs(vMid - selModel) < 0.5)
    col = mix(col, selCol, smoothstep(0.55, 1.0, r2) * 0.95);
#ifdef OUTLINEONLY
  if(rim < 0.30) discard;                 // keep ONLY the outline ring — the fill is dropped
  gl_FragColor = vec4(vec3(0.06), rim);   // BLACK ink ring (like every other atom's outline), on top of everything
  return;
#endif
#ifdef COFHIDE
  if(cofClear > 0.5) alpha *= mix(cofAlpha, cofOutAlpha, rim);   // see-through atom: fill opacity in the body, outline opacity on the rim
#endif
#ifdef DEPTHSHADE
  // Front-to-back darkening, applied to the FINAL colour (after the outline) so the outline darkens WITH
  // the fill and stays visible. dt ramps 0 at the start point to 1 across the spread, farther = darker.
  float dt = clamp((length(vCenterV) - focalD - startOff) / max(spread, 1.0), 0.0, 1.0);   // camera distance past the pivot (focalD = the orbit radius) - farther = darker, from any angle
  col *= mix(1.0, depthLo, dt * depthK);
#endif
  float fog = clamp((fogEnd - posV.z) / (fogEnd - fogStart), 0.0, 1.0);
#ifdef PLIGHT
  col += protonLight(vWCen);
#endif
  gl_FragColor = vec4(mix(fogColor, col, fog), alpha);
}`;

/* Cofactor line-of-sight depth pass — EVERY cofactor atom as a camera-facing disc. Each atom defines
   its OWN cone (a frustum): radius tipRatio of the disc AT the atom, radius baseRatio toward the camera.
   Per pixel we keep the DEEPEST "reveal depth" over all atoms' cones (via gl_FragDepthEXT), so the union
   of cones reflects the whole cofactor's SHAPE. The protein shader clears an atom in front of that depth.
   revealDepth(du) = baseRatio*vz / (du + baseRatio - tipRatio):  = vz at a cone's axis (clears to the atom),
   shrinks toward the disc edge → a cone tapering to each atom. */
BABYLON.Effect.ShadersStore['cofdVertexShader'] = `
precision highp float;
attribute vec3 position;                       // ±1 quad corner
attribute vec4 world0; attribute vec4 world1; attribute vec4 world2; attribute vec4 world3;
attribute float dr;                            // this atom's tube radius in WORLD units, Ångström (0 = its type is toggled off)
attribute float modelId;                       // which loaded model this cofactor atom belongs to
uniform mat4 view; uniform mat4 projection;
uniform mat4 modelXform[80];                   // per-model transform so the cone follows a moved molecule
varying vec2 vq; varying float vz;
void main(void){
  vec3 center = vec3(world3.x, world3.y, world3.z);   // instance translation = atom centre
  center = (modelXform[int(modelId + 0.5)] * vec4(center, 1.0)).xyz;   // follow the model drag/rotate
  vec4 cv = view * vec4(center, 1.0);
  vz = cv.z;                                          // view-space depth (larger = farther)
  vq = position.xy;
  cv.xy += vq * dr;                                   // camera-facing disc of a FIXED WORLD radius (constant tube diameter in Ångström)
  gl_Position = projection * cv;
}`;
BABYLON.Effect.ShadersStore['cofdFragmentShader'] = `
precision highp float;
uniform float tipRatio;   // cone width AT the atom (0 = point tip)
uniform float baseRatio;  // cone width toward the CAMERA
uniform float coneReach;  // extra depth BEHIND the atom the cone still clears (Å)
varying vec2 vq; varying float vz;
void main(void){
  if(dot(vq, vq) > 1.0) discard;                // circular tunnel cross-section
  float du = length(vq);                        // 0 at this atom's axis → 1 at its disc edge
  float denom = du + baseRatio - tipRatio;
  float rd = (denom > 0.001) ? (baseRatio * vz / denom) : 1.0e8;   // this atom's cone reveal-depth at this pixel
  rd = min(rd + coneReach, 1.0e8);              // push the reveal a bit deeper (behind the atom)
  gl_FragColor = vec4(rd, 0.0, 0.0, 1.0);       // R = reveal depth (protein in front of it clears here)
  gl_FragDepthEXT = 1.0 - clamp(rd, 0.0, 6000.0) / 6001.0;   // DEEPEST reveal wins → union of every atom's cone
}`;

/* Cofactor coverage mask — each cofactor atom as a camera-facing disc of its vdW radius (a cheap
   stand-in for the sphere's screen silhouette). Solid white → the union is the cofactors' filled
   coverage, whose OUTER edge the cofsil post-process inks as the molecule outline. */
BABYLON.Effect.ShadersStore['cofmaskVertexShader'] = `
precision highp float;
attribute vec3 position;
attribute vec4 world0; attribute vec4 world1; attribute vec4 world2; attribute vec4 world3;
attribute float dr;                            // this atom's vdW radius in world units
attribute float modelId;                       // which loaded model this cofactor atom belongs to
uniform mat4 view; uniform mat4 projection;
uniform mat4 modelXform[80];                   // per-model transform so the silhouette follows a moved molecule
uniform float boilQuad;                        // quad expansion so the boil bulge is not clipped
uniform float uT;
uniform float boilHzAdj; uniform float boil; uniform float uTb;
varying vec2 vq; varying vec3 vWC;
void main(void){
  vec3 base = vec3(world3.x, world3.y, world3.z);
  base = (modelXform[int(modelId + 0.5)] * vec4(base, 1.0)).xyz;   // follow the model drag/rotate
  vWC = base;                                   // raw centre → the boil warp's world-locked field (matches the imp shader)
  // SAME per-atom MOTION as the vdW sphere shader: always-on thermal shake + stepped boil drift, so the
  // mask disc rides WITH each wobbling atom (this is what the outline was missing).
  vec3 wc = base + 0.12*vec3(sin(uT*1.3+base.x*0.12+base.y*0.08), sin(uT*1.1+base.y*0.12+base.z*0.08), sin(uT*1.6+base.z*0.12+base.x*0.08));
  if(boil > 0.001){ float bt = floor(uTb * (7.0 + boilHzAdj));
    float hx = fract(sin(dot(base, vec3(12.9898,78.233,37.719))+bt)*43758.5453)-0.5;
    float hy = fract(sin(dot(base, vec3(93.989,47.271,23.157))+bt*2.3)*19349.663)-0.5;
    float hz = fract(sin(dot(base, vec3(39.346,11.135,83.155))+bt*1.7)*24634.633)-0.5;
    wc += boil*0.2*vec3(hx, hy, hz);
  }
  vec4 cv = view * vec4(wc, 1.0);
  vq = position.xy;
  cv.xy += vq * dr;                             // plain disc of the atom's vdW radius
  gl_Position = projection * cv;
}`;
BABYLON.Effect.ShadersStore['cofmaskFragmentShader'] = `
precision highp float;
varying vec2 vq; varying vec3 vWC;
uniform float boilQuad, boil, uT;
uniform vec3 camRight, camUp;                  // main-camera world axes → matches the imp shader's boil warp
void main(void){
  // Plain round disc (the atom still wobbles via its CENTRE in the vertex). No per-fragment edge warp:
  // that warp scaled with zoom (±1.5% of a huge on-screen radius), waving the outline into a thick band.
  if(dot(vq, vq) > 1.0) discard;
  gl_FragColor = vec4(1.0);
}`;

/* "Excited" electron for the chlorophyll Mg — ONE big, slow, always-camera-facing electron drawn in the
   SAME blue reflection-on-the-orbital style as the roaming orbital electrons, on a sphere the size of Mg's
   outer s orbital. Rendered on top of everything (the JS forces the depth test to ALWAYS). */

uniform float bubbleR;
uniform float opacity;
uniform vec3 fogColor;
uniform float fogStart;
uniform float fogEnd;

uniform float uTe;         // electron clock - its own slider, independent of uT

varying vec3 vNrmV;
varying vec3 vLocalDir;
varying float vCang;
#ifdef MEMFADE

varying float vMemAnc;

varying float vOid;
varying float vSeed;
varying vec3 vAx0;
varying vec3 vAx1;
varying vec3 vAx2;
varying float vSel;
varying vec3 vBcol;

uniform float focusAmt;   // O: grayscale everything OUTSIDE the selection (its exact silhouette stays colour)

uniform vec3 focusCenterV;
uniform float focusR;
uniform float focusSet[48];
uniform float focusDark;  // darken the grayscale (non-selection) environment
varying float vMid;       // this instance's model index
// Electron glow: a small breathing point of light that slowly orbits its camera-facing spot,
// with flickering electric filaments crackling around it. nElec = 1 or 2.
vec3 gElecP = vec3(0.0);   // the current electron's surface point (view space), set before each elecBolt
float elecBolt(vec3 N, vec3 e, vec3 uref){
  float fr = (vOid >= 2000.0) ? 1.9 : (vOid >= 900.0) ? 1.2 : (0.6*max(0.0, floor(vOid/100.0) - 1.0));   // energy ladder: core shells (rise with n) < bonding σ/π (900–1999, stabilised) < lone pairs (≥2000, non-bonding, often the HOMO)
#ifdef LIPBAKE
  float d = clamp(dot(N, e), -1.0, 1.0);   // baked lipid lobes carry no axes - the angular ripple stays
  vec3 tp = N - d*e;
  float rad = acos(clamp(d, 0.0, 1.0));
#else
  vec3 tv = vViewPos - gElecP;             // from the electron's surface point to this fragment, view units
  vec3 tp = tv - dot(tv, e)*e;
  float rad = length(tv) / 0.21;           // world distance read as the angle it would be on a horn of radius 0.21 - the ripple keeps one size on every lobe
#endif
  vec3 u = normalize(uref - dot(uref, e)*e), w = cross(e, u);
  float ang = atan(dot(tp, w), dot(tp, u));
  // A wave that TRAVELS around the ring: bright crests march around the circle over time via the
  // azimuthal phase (m·ang − ω·t + spiral) while the concentric rings breathe outward. m (crests
  // around the ring) rises with orbital energy — the moving, phase-shifting ripple, not a static bloom.
  float m = 3.0 + fr * 9.0;
  float rings  = 0.5 + 0.5*sin(rad*20.0 - uTe*2.5);          // concentric rings, slow outward breath
  float travel = 0.6 + 0.4*sin(ang*m - uTe*4.0 + rad*6.0);   // bright crests march AROUND the circle
  return rings * travel * exp(-rad*3.4);

// A quasi-random wandering direction (incommensurate sines → never repeats), per-lobe phase s.
vec3 wanderDir(float s){
  return normalize(vec3(
    sin(uTe*0.73 + s) + 0.7*sin(uTe*1.61 + s*2.3),
    sin(uTe*0.91 + s*1.7) + 0.7*sin(uTe*1.29 + s*0.6),
    sin(uTe*1.13 + s*0.4) + 0.7*sin(uTe*0.53 + s*3.1)));

// Fold a full-sphere direction onto the camera-facing hemisphere so the electron is ALWAYS visible
// (never slips behind the lobe), while still roaming the whole visible surface.
vec3 toFront(vec3 w, vec3 V, vec3 fb){

varying vec2 vUV;
uniform sampler2D textureSampler;
uniform sampler2D cofMask;
uniform vec2 texel;
uniform float cofW;
void main(void){

   sits exactly on the atoms). The union is the selected complexes' filled coverage → the seloutline pass

precision highp float;
varying vec2 vUV;
uniform sampler2D textureSampler;

uniform vec2 texel;
uniform float owidth;
uniform float selOn;
